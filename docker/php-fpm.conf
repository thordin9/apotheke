; Apotheke php-fpm pool (overrides the image's www.conf / zz-docker.conf).
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; restores may run up to max_execution_time=300 on /backup/restore
request_terminate_timeout = 320s
; keep DATA_DIR, APP_PASSWORD, DB_* … from the container environment (env/config.php behaviour)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
