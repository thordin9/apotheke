; FrankenPHP only: nginx raised these per location for /backup/restore (fastcgi_param PHP_VALUE); FrankenPHP has
; one PHP config, so the PHP limits are the restore ones and Caddy caps every other request at 22 MB
; (request_body in the Caddyfile). The per-photo and per-attachment caps stay in the app (max_upload_mb,
; attach_max_mb), and the restore controller already calls set_time_limit(300).
upload_max_filesize = 512M
post_max_size = 520M
