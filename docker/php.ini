; Apotheke PHP settings
upload_max_filesize = 20M
post_max_size = 22M
max_file_uploads = 4
memory_limit = 256M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Arguments in a trace can be a DSN or a password, and a failed connect must not log the
; PDO constructor arguments (user, password). Leave them out.
zend.exception_ignore_args = On
file_uploads = On

opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; JIT stays off (no jit buffer). Function JIT can miscompile the QR encoder; src/qr.php disables it if an install turns it on.

session.gc_probability = 1
session.gc_divisor = 1000
