# Apotheke – nginx in front of php-fpm (same container, unix socket). Port of the former Apache vhost.
# __PORT__ is replaced by the entrypoint with $PORT (default 80).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/csv text/plain application/manifest+json;

    # Requests up to 22 MB (matches post_max_size); /backup/restore below allows more.
    client_max_body_size 22m;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    upstream php { server unix:/run/php-fpm.sock; }

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;
        root /var/www/app/public;
        index index.php;
        autoindex off;

        # Static files: long-lived cache for assets (Apache: mod_expires + Cache-Control immutable).
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            add_header X-Content-Type-Options nosniff always;
        }

        # Never serve or execute anything else that looks like code or private data.
        location ~ /\. { return 404; }
        location ~ ^/(src|data|bin|migrations|docker|tests|vendor|config\.php)(/|$) { return 404; }
        # Only the front controller runs PHP; any other *.php is a 404, never executed.
        location ~ \.(php|phtml|phar)$ {
            if ($uri != /index.php) { return 404; }
            try_files /index.php =404;
            include /etc/nginx/apotheke-fastcgi.conf;
        }

        # Everything that is not an existing file goes to the front controller (Apache: FallbackResource).
        location / {
            try_files $uri @app;
        }
        location @app {
            include /etc/nginx/apotheke-fastcgi.conf;
        }

        # Restoring a backup (zip with all photos) may be much bigger and slower.
        location = /backup/restore {
            client_max_body_size 520m;
            client_body_timeout 300s;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            include /etc/nginx/apotheke-fastcgi.conf;
            fastcgi_param PHP_VALUE "upload_max_filesize=512M
post_max_size=520M
max_execution_time=300";
        }
    }
}
