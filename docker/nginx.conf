# Apotheke – nginx in front of php-fpm (same container, unix socket). Port of the former Apache vhost.
# __PORT__ is replaced by the entrypoint with $PORT (default 9091).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/csv text/plain application/manifest+json;

    # Requests up to 22 MB (matches post_max_size); /backup/restore below allows more.
    client_max_body_size 22m;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    fastcgi_read_timeout 75s;

    upstream php { server unix:/run/php-fpm.sock; }

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;
        root /var/www/app/public;
        index index.php;
        autoindex off;

        # Static files: long-lived cache for assets (Apache: mod_expires + Cache-Control immutable; one header here).
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Camera originals are not a URL, in any spelling (/originals, /Originals, /ORIGINALS).
        location ~* ^/originals(/|$) { return 404; }

        # Never serve or execute anything else that looks like code or private data.
        location ~ /\. { return 404; }
        location ~ ^/(src|data|bin|migrations|docker|tests|vendor|config\.php)(/|$) { return 404; }
        # Only the front controller runs PHP; any other *.php is a 404, never executed.
        location ~ \.(php|phtml|phar)$ {
            if ($uri != /index.php) { return 404; }
            try_files /index.php =404;
            include /etc/nginx/apotheke-fastcgi.conf;
        }

        # Everything that is not an existing file goes to the front controller (Apache: FallbackResource).
        location / {
            try_files $uri @app;
        }
        location @app {
            include /etc/nginx/apotheke-fastcgi.conf;
        }

        # Restoring a backup (zip with all photos) may be much bigger and slower. The large limit applies only
        # once the app has said yes to /backup/restore/check (signed in with the Backup permission, or sign-in
        # off): auth_request runs before nginx reads the body, so anyone else gets 401/403 without an upload.
        location = /backup/restore {
            auth_request /_restore_check;
            # nginx turns any check answer other than 2xx/401/403 into 500; answer 421 (unknown Host) instead.
            auth_request_set $restore_check $upstream_status;
            error_page 500 = @restore_check_failed;
            client_max_body_size 520m;
            client_body_timeout 300s;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            include /etc/nginx/apotheke-fastcgi.conf;
            fastcgi_param PHP_VALUE "upload_max_filesize=512M
post_max_size=520M
max_execution_time=300";
        }
        # The subrequest for auth_request above: the same front controller, as a body-less GET of the check route.
        location = /_restore_check {
            internal;
            client_max_body_size 520m;  # the subrequest sees the parent's Content-Length; the body is never passed
            fastcgi_pass php;
            fastcgi_pass_request_body off;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param REQUEST_URI /backup/restore/check;
            fastcgi_param QUERY_STRING "";
            fastcgi_param CONTENT_TYPE "";
            fastcgi_param CONTENT_LENGTH "";
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param PATH_INFO "";
            fastcgi_param HTTP_PROXY "";
        }
        location @restore_check_failed {
            # the same short plain-text body as the app's own 421 (src/hosts.php), not nginx's generic page
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control no-store always;
            if ($restore_check = 421) { return 421 "Unknown host name. Open the app by its address, or add this name to ALLOWED_HOSTS (or PUBLIC_URL).\n"; }
            return 500;
        }
    }
}
