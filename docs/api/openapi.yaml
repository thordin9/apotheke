{
  "openapi": "3.0.3",
  "info": {
    "title": "Apotheke API",
    "version": "1.0.0-p1",
    "description": "Apotheke's JSON API, version 1 (P1: the session, your account and this document; P2: reading the settings, users, roles, the sign-in policy and the branding; P3: CSV imports). Sign-in is a cookie session: the session cookie is __Host-apothekesid on HTTPS and apothekesid on plain HTTP. Every POST, PUT, PATCH and DELETE needs Origin (this server's own origin or one in CORS_ALLOWED_ORIGINS), a JSON or multipart body or none, and the session's CSRF token from GET /api/v1/session in the X-CSRF-Token header. Errors are RFC 9457 application/problem+json with a stable `code`. Cookie consent: the server sets no cookie at all (no session, no CSRF token) until the request carries the cookie apotheke_consent=v1, which the banner script sets when the user clicks Accept (only the name and the exact value count; any other value is no consent). Without it, reads still answer (GET /api/v1/session with an empty csrf_token), and every POST, PUT, PATCH and DELETE is 403 with code consent_required and error consent_required."
  },
  "paths": {
    "/api/v1/session": {
      "get": {
        "operationId": "getSession",
        "summary": "Who is signed in, what they may do, and the CSRF token",
        "description": "Starts a session when there is none, so the token can be used for the next request. Without cookie consent it starts none and csrf_token is empty.",
        "responses": {
          "200": {"description": "The session", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Session"}}}}
        }
      },
      "post": {
        "operationId": "signIn",
        "summary": "Sign in",
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}],
        "requestBody": {
          "required": true,
          "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Credentials"}}}
        },
        "responses": {
          "200": {"description": "Signed in: the new session, with a new CSRF token", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Session"}}}},
          "400": {"$ref": "#/components/responses/Problem"},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Forbidden"},
          "409": {"$ref": "#/components/responses/Problem"},
          "415": {"$ref": "#/components/responses/Problem"},
          "422": {"$ref": "#/components/responses/Problem"},
          "429": {"$ref": "#/components/responses/RateLimited"}
        }
      },
      "delete": {
        "operationId": "signOut",
        "summary": "Sign out",
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}],
        "responses": {
          "204": {"description": "Signed out"},
          "403": {"$ref": "#/components/responses/Forbidden"}
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getMe",
        "summary": "Your own account (signed in only)",
        "responses": {
          "200": {"description": "Your account", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Me"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/consent": {
      "post": {
        "operationId": "acceptCookies",
        "summary": "Cookie consent without JavaScript (the pages' notice form; not part of /api)",
        "description": "The consent notice's Accept form on the app's own pages. No CSRF token: the request must be strictly same-origin (Sec-Fetch-Site same-origin, or an Origin that is this server's own; same-site, cross-site and none are refused, and so is a request with neither header). Sets only apotheke_consent=v1 (Path=/; Max-Age=15552000; SameSite=Lax; Secure on HTTPS; not HttpOnly; Domain=getapotheke.com on a getapotheke.com host, else host-only).",
        "requestBody": {"required": true, "content": {"application/x-www-form-urlencoded": {"schema": {
          "type": "object", "required": ["consent"],
          "properties": {
            "consent": {"type": "string", "enum": ["accept"]},
            "return": {"type": "string", "description": "Where to go back to: a path on this site starting with a single /; anything else (//host, /\\host, a URL, %2F%2F, %5C, CR or LF) goes to /", "default": "/"}
          }
        }}}},
        "responses": {
          "303": {"description": "The consent cookie is set; Location is the return path or /", "headers": {
            "Location": {"schema": {"type": "string"}},
            "Set-Cookie": {"schema": {"type": "string", "example": "apotheke_consent=v1; Path=/; Max-Age=15552000; SameSite=Lax"}}
          }},
          "400": {"description": "consent is not accept: no cookie", "content": {"text/html": {}}},
          "403": {"description": "Not strictly same-origin: no cookie", "content": {"text/html": {}}}
        }
      }
    },
    "/api/v1/openapi.json": {
      "get": {
        "operationId": "getOpenApi",
        "summary": "This document",
        "responses": {
          "200": {"description": "The OpenAPI document", "content": {"application/json": {"schema": {"type": "object", "required": ["openapi", "paths"]}}}}
        }
      }
    },
    "/api/v1/settings": {
      "get": {
        "operationId": "getSettings",
        "summary": "Every Control Panel section's settings, with their schema (settings permission)",
        "description": "The sections general, appearance, locale, list, items, limits, labels, uploads, autofill and data, in that order. Users & sign-in has its own API (users permission). Write-only settings, such as the autofill access token, are never returned: the autofill section says only whether a token is set.",
        "responses": {
          "200": {"description": "Every section", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Settings"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/settings/general": {
      "get": {"operationId": "getSettingsGeneral", "summary": "The general section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/appearance": {
      "get": {"operationId": "getSettingsAppearance", "summary": "The appearance section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/locale": {
      "get": {"operationId": "getSettingsLocale", "summary": "The locale section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/list": {
      "get": {"operationId": "getSettingsList", "summary": "The list section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/items": {
      "get": {"operationId": "getSettingsItems", "summary": "The items section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/limits": {
      "get": {"operationId": "getSettingsLimits", "summary": "The limits section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/labels": {
      "get": {"operationId": "getSettingsLabels", "summary": "The labels section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/uploads": {
      "get": {"operationId": "getSettingsUploads", "summary": "The uploads section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/autofill": {
      "get": {"operationId": "getSettingsAutofill", "summary": "The autofill section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/settings/data": {
      "get": {"operationId": "getSettingsData", "summary": "The data section (settings permission)", "parameters": [{"$ref": "#/components/parameters/IfNoneMatch"}], "responses": {"200": {"$ref": "#/components/responses/SettingsSection"}, "304": {"$ref": "#/components/responses/NotModified"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}}
    },
    "/api/v1/imports": {
      "post": {
        "operationId": "createImport",
        "summary": "Upload a CSV file to import (import permission)",
        "description": "The file waits until it is imported; a day after its upload it is deleted. Columns are mapped automatically from their headers.",
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}],
        "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"type": "object", "required": ["file"], "properties": {"file": {"type": "string", "format": "binary", "description": "A CSV file, at most 5 MB"}}}}}},
        "responses": {
          "201": {"description": "The upload", "headers": {"Location": {"description": "The import", "schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Import"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"},
          "413": {"$ref": "#/components/responses/Problem"},
          "415": {"$ref": "#/components/responses/Problem"},
          "422": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/imports/{id}": {
      "get": {
        "operationId": "getImport",
        "summary": "An upload: its columns, a sample of its rows and the fields they can map to (import permission)",
        "parameters": [{"$ref": "#/components/parameters/ImportId"}],
        "responses": {
          "200": {"description": "The upload", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Import"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"},
          "404": {"$ref": "#/components/responses/Problem"},
          "410": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/imports/{id}/preview": {
      "get": {
        "operationId": "previewImport",
        "summary": "What importing the file would do, row by row (import permission)",
        "description": "Writes nothing. Without `map` the saved mapping is used; with it, it is checked and used for this answer only. Only the user who uploaded the file, or an admin, sees it; anyone else gets the same 404 as for an unknown id.",
        "parameters": [
          {"$ref": "#/components/parameters/ImportId"},
          {"name": "map", "in": "query", "required": false, "description": "The field for each column, in order, comma-separated; empty ignores the column", "schema": {"type": "string"}},
          {"name": "create", "in": "query", "required": false, "description": "Create missing locations, categories and tags (1 or 0)", "schema": {"type": "string", "enum": ["0", "1", "true", "false"]}},
          {"name": "skip_errors", "in": "query", "required": false, "description": "Import the rows without errors and skip the others (1 or 0)", "schema": {"type": "string", "enum": ["0", "1", "true", "false"]}},
          {"$ref": "#/components/parameters/Page"},
          {"$ref": "#/components/parameters/PerPage"}
        ],
        "responses": {
          "200": {"description": "One page of rows, and the totals", "headers": {"Link": {"description": "The next and previous pages", "schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImportPreview"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"},
          "404": {"$ref": "#/components/responses/Problem"},
          "409": {"$ref": "#/components/responses/Problem"},
          "410": {"$ref": "#/components/responses/Problem"},
          "422": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/users": {
      "get": {
        "operationId": "getUsers",
        "summary": "Every account, sorted by name (users permission)",
        "description": "Each account is exactly id, name, role, status, created_at and last_login_at. Passwords, their hashes and session data are never returned.",
        "responses": {
          "200": {"description": "Every account", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Users"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/roles": {
      "get": {
        "operationId": "getRoles",
        "summary": "Every role, built-in first, with its permissions (users permission)",
        "responses": {
          "200": {"description": "Every role", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Roles"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/security": {
      "get": {
        "operationId": "getSecurity",
        "summary": "Whether sign-in is on, and the sign-in policy (users permission)",
        "responses": {
          "200": {"description": "The sign-in policy", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Security"}}}},
          "401": {"$ref": "#/components/responses/Problem"},
          "403": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/api/v1/branding": {
      "get": {
        "operationId": "getBranding",
        "summary": "The app's name, colours and icons (anyone)",
        "description": "What every page's head and the sign-in page already show, so it needs no sign-in, like /manifest.webmanifest.",
        "responses": {
          "200": {"description": "The branding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Branding"}}}}
        }
      }
    }
  },
  "components": {
    "parameters": {
      "CsrfToken": {"name": "X-CSRF-Token", "in": "header", "required": true, "description": "The csrf_token from GET /api/v1/session", "schema": {"type": "string"}},
      "IfNoneMatch": {"name": "If-None-Match", "in": "header", "required": false, "description": "An ETag from an earlier answer: 304 when it is still current", "schema": {"type": "string"}},
      "ImportId": {"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}},
      "Page": {"name": "page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "default": 1}},
      "PerPage": {"name": "per_page", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}
    },
    "responses": {
      "Problem": {"description": "An error", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "Forbidden": {"description": "Refused: csrf.invalid (Origin, body type or token), permission.denied, or consent_required when the request carries no apotheke_consent=v1 cookie (then the body also has error: consent_required and no cookie is set)", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
      "RateLimited": {
        "description": "Too many attempts",
        "headers": {"Retry-After": {"description": "Seconds to wait", "schema": {"type": "integer"}}},
        "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}
      },
      "SettingsSection": {
        "description": "One section",
        "headers": {"ETag": {"description": "The section's version, for If-None-Match", "schema": {"type": "string"}}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SettingsSection"}}}
      },
      "NotModified": {
        "description": "Not modified: the ETag in If-None-Match is current",
        "headers": {"ETag": {"description": "The current ETag", "schema": {"type": "string"}}}
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "title", "status", "detail", "code"],
        "properties": {
          "type": {"type": "string"},
          "title": {"type": "string"},
          "status": {"type": "integer"},
          "detail": {"type": "string"},
          "code": {"type": "string", "description": "A stable machine code: auth.required, auth.invalid_credentials, auth.pending_approval, auth.sign_in_off, bad_request, csrf.invalid, not_found, permission.denied, rate_limited, unsupported_media_type, upload.too_large, validation.failed, import.done, import.gone, consent_required"},
          "error": {"type": "string", "enum": ["consent_required"], "description": "Only on 403 consent_required: the same code"},
          "errors": {"type": "object", "additionalProperties": {"type": "string"}, "description": "Field => message, for 422"}
        }
      },
      "Permissions": {
        "type": "array",
        "items": {"type": "string", "enum": ["view", "create", "edit", "delete", "move", "bulk", "lend", "import", "export", "stocktake", "labels", "settings", "users", "backup"]}
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "required": ["signed_in", "sign_in_enabled", "registration_open", "user", "permissions", "csrf_token"],
        "properties": {
          "signed_in": {"type": "boolean"},
          "sign_in_enabled": {"type": "boolean", "description": "Off: everyone is the anonymous admin and there is nothing to sign in to"},
          "registration_open": {"type": "boolean"},
          "user": {
            "type": "object",
            "nullable": true,
            "additionalProperties": false,
            "required": ["id", "username", "role"],
            "properties": {"id": {"type": "integer"}, "username": {"type": "string"}, "role": {"type": "string"}}
          },
          "permissions": {"$ref": "#/components/schemas/Permissions"},
          "csrf_token": {"type": "string", "pattern": "^([a-f0-9]{64})?$", "description": "Empty without cookie consent: no session is started"}
        }
      },
      "Credentials": {
        "type": "object",
        "required": ["username", "password"],
        "properties": {"username": {"type": "string", "minLength": 1}, "password": {"type": "string", "minLength": 1, "format": "password"}}
      },
      "Me": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "username", "role", "permissions"],
        "properties": {
          "id": {"type": "integer"},
          "username": {"type": "string"},
          "role": {"type": "string"},
          "permissions": {"$ref": "#/components/schemas/Permissions"}
        }
      },
      "Settings": {
        "type": "object",
        "additionalProperties": false,
        "required": ["sections"],
        "properties": {"sections": {"type": "array", "items": {"$ref": "#/components/schemas/SettingsSection"}}}
      },
      "SettingsSection": {
        "type": "object",
        "additionalProperties": false,
        "required": ["section", "title", "description", "values", "fields", "etag"],
        "properties": {
          "section": {"type": "string", "enum": ["general", "appearance", "locale", "list", "items", "limits", "labels", "uploads", "autofill", "data"]},
          "title": {"type": "string"},
          "description": {"type": "string"},
          "values": {"type": "object", "description": "Each field's current value, by key", "additionalProperties": {"nullable": true}},
          "fields": {"type": "array", "items": {"$ref": "#/components/schemas/SettingsField"}},
          "token_set": {"type": "boolean", "description": "autofill only: whether an access token is set (the token itself is write-only)"},
          "etag": {"type": "string", "pattern": "^\"[a-f0-9]{64}\"$"}
        }
      },
      "SettingsField": {
        "type": "object",
        "additionalProperties": false,
        "required": ["key", "label", "type", "default", "help", "rules"],
        "properties": {
          "key": {"type": "string"},
          "label": {"type": "string"},
          "type": {"type": "string", "enum": ["string", "int", "bool", "enum", "color", "timezone", "url", "tags", "af_model", "af_size", "af_bytes"]},
          "default": {"nullable": true},
          "help": {"type": "string"},
          "rules": {
            "type": "object",
            "description": "Validation: min, max (a number, or a string's length), required, nullable, placeholder, and options (value => label) for an enum",
            "properties": {
              "min": {"type": "integer"},
              "max": {"type": "integer"},
              "required": {"type": "boolean"},
              "nullable": {"type": "boolean"},
              "placeholder": {"type": "string"},
              "options": {"type": "object", "additionalProperties": {"type": "string"}}
            }
          }
        }
      },
      "ImportOptions": {
        "type": "object",
        "additionalProperties": false,
        "required": ["create", "skip_errors"],
        "properties": {"create": {"type": "boolean"}, "skip_errors": {"type": "boolean"}}
      },
      "Import": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "file_name", "status", "total_rows", "options", "columns", "sample", "sample_formula", "fields", "result", "created_at", "finished_at"],
        "properties": {
          "id": {"type": "integer"},
          "file_name": {"type": "string"},
          "status": {"type": "string", "description": "uploaded (waiting) or done"},
          "total_rows": {"type": "integer"},
          "options": {"$ref": "#/components/schemas/ImportOptions"},
          "columns": {"type": "array", "description": "Empty once imported (the file is gone)", "items": {"type": "object", "additionalProperties": false, "required": ["index", "header", "field"], "properties": {"index": {"type": "integer"}, "header": {"type": "string"}, "field": {"type": "string", "description": "The mapped field, or empty"}}}},
          "sample": {"type": "array", "description": "The first rows, each cell raw (as it is imported)", "items": {"type": "array", "items": {"type": "string"}}},
          "sample_formula": {"type": "array", "description": "For each sample row, the indexes of its cells that start with = + - @, a tab or CR (a spreadsheet runs them as formulas). The values stay raw: a client that writes them to a CSV must neutralise them, as the export does with a leading apostrophe.", "items": {"type": "array", "items": {"type": "integer"}}},
          "fields": {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["key", "label"], "properties": {"key": {"type": "string"}, "label": {"type": "string"}}}},
          "result": {"type": "object", "nullable": true, "description": "Once imported: created, updated, unchanged, skipped and made"},
          "created_at": {"type": "string"},
          "finished_at": {"type": "string", "nullable": true}
        }
      },
      "ImportPreview": {
        "type": "object",
        "additionalProperties": false,
        "required": ["import_id", "mapping", "options", "summary", "data", "meta", "links"],
        "properties": {
          "import_id": {"type": "integer"},
          "mapping": {"type": "array", "items": {"type": "string"}},
          "options": {"$ref": "#/components/schemas/ImportOptions"},
          "summary": {
            "type": "object",
            "additionalProperties": false,
            "required": ["rows", "created", "updated", "unchanged", "errors", "made"],
            "properties": {
              "rows": {"type": "integer"}, "created": {"type": "integer"}, "updated": {"type": "integer"}, "unchanged": {"type": "integer"}, "errors": {"type": "integer"},
              "made": {"type": "object", "additionalProperties": false, "required": ["location", "category", "tag"], "properties": {"location": {"type": "array", "items": {"type": "string"}}, "category": {"type": "array", "items": {"type": "string"}}, "tag": {"type": "array", "items": {"type": "string"}}}}
            }
          },
