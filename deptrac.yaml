# Core depends on nothing. DevServer and Migrations may depend on Core.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
  ruleset:
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
