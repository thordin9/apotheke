# Core depends on nothing. DevServer and Settings may depend on Core.
# Auth may depend on Core and Settings.
# Migrations may depend on Core and on Settings (schema only).
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Auth
      collectors:
        - type: classLike
          value: ^Apotheke\\Auth\\
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
    - name: Settings
      collectors:
        - type: classLike
          value: ^Apotheke\\Settings\\
  ruleset:
    Auth:
      - Core
      - Settings
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
      - Settings
    Settings:
      - Core
