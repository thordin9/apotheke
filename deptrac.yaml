# Core depends on nothing. DevServer, Settings and Autofill may depend on Core.
# Migrations may depend on Core and on Settings (schema only).
# Autofill may depend on Settings. Media and Taxonomy are not modules yet.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
    - name: Settings
      collectors:
        - type: classLike
          value: ^Apotheke\\Settings\\
    - name: Autofill
      collectors:
        - type: classLike
          value: ^Apotheke\\Autofill\\
  ruleset:
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
      - Settings
    Settings:
      - Core
    Autofill:
      - Core
      - Settings
