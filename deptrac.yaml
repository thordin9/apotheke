# Core depends on nothing. DevServer, Settings and Autofill may depend on Core.
# Auth may depend on Core and Settings.
# Migrations may depend on Core and on Settings (schema only).
# Autofill may depend on Settings. Layout may depend on Core and Settings (Config\Services
# hands it the user from Auth). Media and Taxonomy are not modules yet.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Auth
      collectors:
        - type: classLike
          value: ^Apotheke\\Auth\\
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
    - name: Settings
      collectors:
        - type: classLike
          value: ^Apotheke\\Settings\\
    - name: Autofill
      collectors:
        - type: classLike
          value: ^Apotheke\\Autofill\\
    - name: Layout
      collectors:
        - type: classLike
          value: ^Apotheke\\Layout\\
    - name: Activity
      collectors:
        - type: classLike
          value: ^Apotheke\\Activity\\
    - name: Taxonomy
      collectors:
        - type: classLike
          value: ^Apotheke\\Taxonomy\\
  ruleset:
    Auth:
      - Core
      - Settings
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
      - Settings
    Settings:
      - Core
    Autofill:
      - Core
      - Settings
    Layout:
      - Core
      - Settings
    # Activity: the item history writer. Taxonomy: its pages use Layout; it writes the item
    # history through Core's ItemHistory, which Activity implements.
    Activity:
      - Core
    Taxonomy:
      - Core
      - Layout
