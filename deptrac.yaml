# Core depends on nothing. DevServer, Settings and Autofill may depend on Core.
# Auth may depend on Core and Settings.
# Migrations may depend on Core and on Settings (schema only).
# Autofill may depend on Settings. Layout may depend on Core and Settings (Config\Services
# hands it the user from Auth). Media may depend on Core and Settings. Taxonomy and Activity:
# see their ruleset entries.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Auth
      collectors:
        - type: classLike
          value: ^Apotheke\\Auth\\
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
    - name: Settings
      collectors:
        - type: classLike
          value: ^Apotheke\\Settings\\
    - name: Autofill
      collectors:
        - type: classLike
          value: ^Apotheke\\Autofill\\
    - name: Layout
      collectors:
        - type: classLike
          value: ^Apotheke\\Layout\\
    - name: Media
      collectors:
        - type: classLike
          value: ^Apotheke\\Media\\
    - name: Activity
      collectors:
        - type: classLike
          value: ^Apotheke\\Activity\\
    - name: Taxonomy
      collectors:
        - type: classLike
          value: ^Apotheke\\Taxonomy\\
    - name: Notes
      collectors:
        - type: classLike
          value: ^Apotheke\\Notes\\
    - name: Search
      collectors:
        - type: classLike
          value: ^Apotheke\\Search\\
    - name: Catalog
      collectors:
        - type: classLike
          value: ^Apotheke\\Catalog\\
    - name: Favourites
      collectors:
        - type: classLike
          value: ^Apotheke\\Favourites\\
    - name: Undo
      collectors:
        - type: classLike
          value: ^Apotheke\\Undo\\
    - name: BulkMerge
      collectors:
        - type: classLike
          value: ^Apotheke\\BulkMerge\\
    - name: Labels
      collectors:
        - type: classLike
          value: ^Apotheke\\Labels\\
    - name: Lending
      collectors:
        - type: classLike
          value: ^Apotheke\\Lending\\
  ruleset:
    Auth:
      - Core
      - Settings
      - Layout
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
      - Settings
    Settings:
      - Core
    Autofill:
      - Core
      - Settings
    Layout:
      - Core
      - Settings
    Media:
      - Core
      - Settings
    # Activity: the item history writer, and its pages (Layout). Taxonomy: its pages use Layout;
    # it writes the item history through Core's ItemHistory, which Activity implements.
    Activity:
      - Core
      - Layout
    Taxonomy:
      - Core
      - Layout
    # Notes: the Markdown renderer for item notes; Catalog and the activity diff use it.
    Notes:
      - Core
    # Search: the index over items and their places. Catalog: the list, overview and saved
    # filters; it shows recently viewed items through its RecentItems, which Favourites implements.
    Search:
      - Core
      - Taxonomy
    Catalog:
      - Core
      - Layout
      - Settings
      - Taxonomy
      - Media
      - Search
      - Activity
      - Undo
      - Notes
    Favourites:
      - Core
      - Catalog
    # Undo: tokens only; putting items back is Catalog's (it saves items).
    Undo:
      - Core
    # BulkMerge (PLAN 11b): bulk actions, merge, duplicate and quantity, on Catalog's items.
    BulkMerge:
      - Core
      - Layout
      - Settings
      - Catalog
      - Taxonomy
      - Media
      - Undo
    # Labels and Lending (PLAN 13): the QR encoder and labels page; lend, return and the lent list.
    # On Catalog's items and Taxonomy's locations; Settings and Taxonomy also come with Catalog's
    # base controller. Lending checks thumbnail names with Media.
    Labels:
      - Core
      - Layout
      - Settings
      - Catalog
      - Taxonomy
    Lending:
      - Core
      - Layout
      - Settings
      - Catalog
      - Taxonomy
      - Media
