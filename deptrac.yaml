# Core depends on nothing. DevServer may depend on Core. Other modules land in later PRs.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
  ruleset:
    Core: []
    DevServer:
      - Core
