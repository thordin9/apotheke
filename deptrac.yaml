# Core depends on nothing. DevServer, Settings and Autofill may depend on Core.
# Auth may depend on Core and Settings.
# Migrations may depend on Core and on Settings (schema only).
# Autofill may depend on Settings. Layout may depend on Core and Settings (Config\Services
# hands it the user from Auth). Media may depend on Core and Settings. Taxonomy and Activity:
# see their ruleset entries.
deptrac:
  paths:
    - ci4/modules
  layers:
    - name: Auth
      collectors:
        - type: classLike
          value: ^Apotheke\\Auth\\
    - name: Core
      collectors:
        - type: classLike
          value: ^Apotheke\\Core\\
    - name: DevServer
      collectors:
        - type: classLike
          value: ^Apotheke\\DevServer\\
    - name: Migrations
      collectors:
        - type: classLike
          value: ^Apotheke\\Migrations\\
    - name: Settings
      collectors:
        - type: classLike
          value: ^Apotheke\\Settings\\
    - name: Autofill
      collectors:
        - type: classLike
          value: ^Apotheke\\Autofill\\
    - name: Layout
      collectors:
        - type: classLike
          value: ^Apotheke\\Layout\\
    - name: Media
      collectors:
        - type: classLike
          value: ^Apotheke\\Media\\
    - name: Activity
      collectors:
        - type: classLike
          value: ^Apotheke\\Activity\\
    - name: Taxonomy
      collectors:
        - type: classLike
          value: ^Apotheke\\Taxonomy\\
    - name: Search
      collectors:
        - type: classLike
          value: ^Apotheke\\Search\\
    - name: Catalog
      collectors:
        - type: classLike
          value: ^Apotheke\\Catalog\\
    - name: Favourites
      collectors:
        - type: classLike
          value: ^Apotheke\\Favourites\\
  ruleset:
    Auth:
      - Core
      - Settings
    Core: []
    DevServer:
      - Core
    Migrations:
      - Core
      - Settings
    Settings:
      - Core
    Autofill:
      - Core
      - Settings
    Layout:
      - Core
      - Settings
    Media:
      - Core
      - Settings
    # Activity: the item history writer. Taxonomy: its pages use Layout; it writes the item
    # history through Core's ItemHistory, which Activity implements.
    Activity:
      - Core
    Taxonomy:
      - Core
      - Layout
    # Search: the index over items and their places. Catalog: the list, overview and saved
    # filters; it shows recently viewed items through its RecentItems, which Favourites implements.
    Search:
      - Core
      - Taxonomy
    Catalog:
      - Core
      - Layout
      - Settings
      - Taxonomy
      - Media
      - Search
    Favourites:
      - Core
      - Catalog
