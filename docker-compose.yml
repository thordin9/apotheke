services:
  apotheke:
    build: .
    image: apotheke:latest
    container_name: apotheke
    restart: unless-stopped
    ports:
      # Only this machine can reach the app. For phones on your network, publish it deliberately, e.g. "9091:9091"
      # (all interfaces) or "192.0.2.10:9091:9091" (one LAN address), and keep sign-in on (hardening, SEC-M3).
      - "127.0.0.1:9091:9091"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-Europe/Athens}
      # Required on the first start (creates the account admin), e.g. in a .env file: APP_PASSWORD=change-me
      # Without it the container refuses to start unless sign-in is already on, or ALLOW_NO_LOGIN=1 is set.
      APP_PASSWORD: ${APP_PASSWORD:-}
      ALLOW_NO_LOGIN: ${ALLOW_NO_LOGIN:-}
      # sqlite (default, stored in ./data/catalog.sqlite) or pgsql (start with: docker compose --profile postgres up -d)
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-apotheke}
      DB_USER: ${DB_USER:-apotheke}
      DB_PASSWORD: ${DB_PASSWORD:-}

  # Optional PostgreSQL. Enable with DB_DRIVER=pgsql and DB_PASSWORD=… in .env, then:
  #   docker compose --profile postgres up -d
  postgres:
    image: postgres:17-alpine
    container_name: apotheke-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-apotheke}
      POSTGRES_USER: ${DB_USER:-apotheke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env to use the postgres profile}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
