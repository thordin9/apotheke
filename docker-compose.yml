services:
  apotheke:
    build: .
    image: apotheke:latest
    container_name: apotheke
    restart: unless-stopped
    ports:
      # Only this machine can reach the app. For phones on your network, publish it deliberately, e.g. "9091:9091"
      # (all interfaces) or "192.0.2.10:9091:9091" (one LAN address), and keep sign-in on (hardening, SEC-M3).
      - "127.0.0.1:9091:9091"
    volumes:
      - ./data:/data
      # APP_KEY_FILE example: keep the key file outside ./data so it is not in the data volume or its backups.
      # php-fpm runs as www-data (uid 82, gid 82). The file must be readable by that user, for example
      #   chown root:www-data secrets/app_key && chmod 0440 secrets/app_key
      # The Compose secrets: block below is readable by the container user and needs no extra mode.
      # - ./secrets/app_key:/run/secrets/app_key:ro
    # Or as a Compose secret (mounted read-only at /run/secrets/app_key), with the top-level secrets: block below.
    # secrets:
    #   - app_key
    environment:
      TZ: ${TZ:-Europe/Athens}
      # Required on the first start (creates the account admin), e.g. in a .env file: APP_PASSWORD=change-me
      # Without it the container refuses to start unless sign-in is already on, or ALLOW_NO_LOGIN=1 is set.
      APP_PASSWORD: ${APP_PASSWORD:-}
      ALLOW_NO_LOGIN: ${ALLOW_NO_LOGIN:-}
      # Base64 of 32 bytes. Recommended so stored secrets are encrypted. Empty keeps them unencrypted.
      # Generate: php -r 'echo base64_encode(random_bytes(32)), PHP_EOL;'
      APP_KEY: ${APP_KEY:-}
      # Optional file mounted from outside the data volume. Ignored when APP_KEY is set.
      # With the bind mount or Compose secret above, set APP_KEY_FILE=/run/secrets/app_key in .env.
      APP_KEY_FILE: ${APP_KEY_FILE:-}
      # sqlite (default, stored in ./data/catalog.sqlite) or pgsql (start with: docker compose --profile postgres up -d)
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-apotheke}
      DB_USER: ${DB_USER:-apotheke}
      DB_PASSWORD: ${DB_PASSWORD:-}

  # Optional PostgreSQL. Enable with DB_DRIVER=pgsql and DB_PASSWORD=… in .env, then:
  #   docker compose --profile postgres up -d
  postgres:
    image: postgres:17-alpine
    container_name: apotheke-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-apotheke}
      POSTGRES_USER: ${DB_USER:-apotheke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env to use the postgres profile}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

# APP_KEY_FILE as a Compose secret: uncomment together with the service's secrets: entry above.
# secrets:
#   app_key:
#     file: ./secrets/app_key
