name: Deploy edge

# The Worker apotheke-api (edge/: Worker, Container Durable Object) and its container (Dockerfile.frankenphp).
# - Pull requests that touch it: Worker guard, types, typecheck and `wrangler deploy --dry-run`, which also builds
#   the container image. No secrets, no previews.
# - Published releases (tags v*): the same checks, then the deploy in the GitHub environment deploy-edge (main and v* only, with a
#   required reviewer).
# - workflow_dispatch on main or a v* tag: the same as a tag.
# Without the CLOUDFLARE_API_TOKEN secret the deploy is skipped and the run stays green.
on:
  pull_request:
    paths:
      - 'edge/**'
      - '!edge/app/**'
      - 'Dockerfile.frankenphp'
      - 'docker/frankenphp/**'
      - 'scripts/cf-worker-guard.mjs'
      - 'scripts/cf-deploy.sh'
      - '.github/workflows/deploy-edge.yml'
  # A published GitHub Release (release.yml creates it with the release App's token, for tag vX.Y.Z). Not `push: tags`:
  # the tag points at the "chore(release): … [skip ci]" commit, and [skip ci] would suppress a tag-push run.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and dry run (apotheke-api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the Worker tooling (edge/)
        working-directory: edge
        run: npm ci --no-audit --no-fund
      - name: Worker guard (allowlist; no routes, no custom domains)
        run: node scripts/cf-worker-guard.mjs apotheke-api edge/wrangler.jsonc -- --dry-run
      - name: Types and typecheck
        working-directory: edge
        run: |
          npx --no-install wrangler types --check
          npx --no-install tsc --noEmit
      - name: wrangler deploy --dry-run (builds the container image; no token, nothing pushed)
        working-directory: edge
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api-bundle"

  deploy:
    name: Deploy apotheke-api
    needs: check
    # A published release (tag v*), or a manual run on main or a v* tag; never pull requests (so never forks).
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: deploy-edge
    steps:
      - name: Mask the account id and check for the token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The deploy-edge environment has no CLOUDFLARE_API_TOKEN secret; nothing was deployed."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # Storage gate (PM decision): no apotheke-api deploy until P4 storage (D1 for data, R2 for files) lands.
      # Runs on every trigger, after the token check (no token = skipped, green) and before any wrangler call.
      - name: Storage gate (repository variable EDGE_STORAGE_READY)
        if: steps.token.outputs.set == 'true'
        env:
          EDGE_STORAGE_READY: ${{ vars.EDGE_STORAGE_READY }}
        run: |
          if [ "$EDGE_STORAGE_READY" != "true" ]; then
            echo "::error title=Edge storage not ready::apotheke-api is stateless until P4 storage (D1/R2) lands; set the repository variable EDGE_STORAGE_READY=true only after that."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.set == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.set == 'true'
        with:
          node-version: '22'
      - name: Install the Worker tooling (edge/)
        if: steps.token.outputs.set == 'true'
        working-directory: edge
        run: npm ci --no-audit --no-fund
      - name: Deploy (Worker guard, then wrangler deploy of apotheke-api and its container only)
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf-deploy.sh apotheke-api edge
