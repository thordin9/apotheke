name: Deploy edge

# The Worker apotheke-api (edge/: Worker, Container Durable Object) and its container (Dockerfile.frankenphp).
# - Pull requests that touch it: Worker guard, types, typecheck and `wrangler deploy --dry-run`, which also builds
#   the container image. No secrets, no previews.
# - Published releases (tags v*): the same checks, then the deploy in the GitHub environment deploy-edge (main and v* only, with a
#   required reviewer).
# - workflow_dispatch on main or a v* tag: the same as a tag.
# Without the CLOUDFLARE_API_TOKEN secret the deploy is skipped and the run stays green; so is the whole deploy job (before
# the environment's review) until the repository variable EDGE_STORAGE_READY is true.
# P4 storage: the deploy job (so only with EDGE_STORAGE_READY=true) merges edge/storage.jsonc (D1 DB, R2 STORAGE in the
# eu jurisdiction, the Installation Durable Object) into edge/wrangler.jsonc, deploys, then checks /healthz. The pull
# request checks keep the default config. Flip checklist: docs/deployment-and-operations.md#p4-edge-storage-flip-checklist.
on:
  pull_request:
    paths:
      - 'edge/**'
      - '!edge/app/**'
      - 'Dockerfile.frankenphp'
      - 'docker/frankenphp/**'
      - 'scripts/cf-worker-guard.mjs'
      - 'scripts/cf-deploy.sh'
      - 'scripts/edge-storage-config.mjs'
      - 'scripts/deploy-scripts.test.mjs'
      - '.github/workflows/deploy-edge.yml'
  # A published GitHub Release (release.yml creates it with the release App's token, for tag vX.Y.Z). Not `push: tags`:
  # the tag points at the "chore(release): … [skip ci]" commit, and [skip ci] would suppress a tag-push run.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and dry run (apotheke-api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor cache-poisoning is a false positive (N-1437): setup-node's automatic package-manager cache
      # is turned off with `package-manager-cache: false` and there is no `cache:` input, so nothing is saved or restored.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the Worker tooling (edge/)
        working-directory: edge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy tooling tests (Worker headers and caching, drift check, guard, cf-deploy.sh; no network)
        run: node --test --experimental-strip-types scripts/deploy-scripts.test.mjs
      - name: Worker guard (allowlist; no routes, no custom domains)
        run: node scripts/cf-worker-guard.mjs apotheke-api edge/wrangler.jsonc -- --dry-run
      - name: Types and typecheck
        working-directory: edge
        run: |
          npx --no-install wrangler types --check --config wrangler.jsonc
          npx --no-install tsc --noEmit
      - name: wrangler deploy --dry-run (builds the container image; no token, nothing pushed)
        working-directory: edge
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/api-bundle"

  deploy:
    name: Deploy apotheke-api
    needs: check
    # A published release that is not a pre-release (tag v*), or a manual run on main or a v* tag; never pull requests
    # (so never forks). The first step also requires a tag to be exactly vX.Y.Z (N-1438).
    # Storage gate (PM decision), here too: until the repository variable EDGE_STORAGE_READY is exactly true the job is
    # skipped before the deploy-edge environment gate, so no review is requested; the in-job gate below stays.
    if: >-
      vars.EDGE_STORAGE_READY == 'true' && (
      (github.event_name == 'release' && !github.event.release.prerelease &&
        startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: deploy-edge
    # One deploy per environment at a time, across refs and runs (N-1434); a running deploy is never cancelled.
    concurrency:
      group: deploy-edge
      cancel-in-progress: false
    # Only reads the release for the tag (L-1460); nothing in this job writes to the repository.
    permissions:
      contents: read
    steps:
      # This step and the gates below must never be allowed to fail open (N-1461): a failure stops the deploy.
      - name: Tag is vX.Y.Z with a published full release (a release or a manual run on a tag)
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        # The runner's `bash --noprofile --norc -eo pipefail`, as scripts/deploy-scripts.test.mjs runs it (N-1465).
        shell: bash
        run: |
          case "$REF" in
            refs/heads/main) exit 0 ;;
            refs/tags/*) ;;
            *) echo "::error title=Not a release ref::Deploys run only on main or a vX.Y.Z tag."; exit 1 ;;
          esac
          if ! [[ "${REF#refs/tags/}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Not a release tag::Deploys run only for tags vX.Y.Z (numbers only)."
            exit 1
          fi
          # L-1460: a manual run on a tag deploys only a published full release. The release-by-tag endpoint returns
          # only published releases, so a draft and a missing release are both a 404 here, and both fail.
          tag="${REF#refs/tags/}"
          if ! state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"draft=\(.draft) prerelease=\(.prerelease)"')"; then
            echo "::error title=No published release::No published GitHub Release for $tag (missing or a draft); nothing was deployed."
            exit 1
          fi
          if [ "$state" != "draft=false prerelease=false" ]; then
            echo "::error title=Not a full release::The release for $tag is a draft or a pre-release ($state); nothing was deployed."
            exit 1
          fi
      - name: Mask the account id and check for the token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The deploy-edge environment has no CLOUDFLARE_API_TOKEN secret; nothing was deployed."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # Storage gate (PM decision): no apotheke-api deploy until P4 storage (D1 for data, R2 for files) lands. The job's
      # `if:` already skips it while EDGE_STORAGE_READY is not true; this second check runs after the token check (no
      # token = skipped, green) and before any wrangler call, in case the job condition is ever changed.
      - name: Storage gate (repository variable EDGE_STORAGE_READY)
        if: steps.token.outputs.set == 'true'
        env:
          EDGE_STORAGE_READY: ${{ vars.EDGE_STORAGE_READY }}
        run: |
          if [ "$EDGE_STORAGE_READY" != "true" ]; then
            echo "::error title=Edge storage not ready::apotheke-api is stateless until P4 storage (D1/R2) lands; set the repository variable EDGE_STORAGE_READY=true only after that."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.set == 'true'
        with:
          persist-credentials: false
      # zizmor cache-poisoning is a false positive (N-1437): setup-node's automatic package-manager cache
      # is turned off with `package-manager-cache: false` and there is no `cache:` input, so nothing is saved or restored.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        if: steps.token.outputs.set == 'true'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the Worker tooling (edge/)
        if: steps.token.outputs.set == 'true'
        working-directory: edge
        run: npm ci --ignore-scripts --no-audit --no-fund
      # P4 storage (behind EDGE_STORAGE_READY, like the whole job): the bindings live in edge/storage.jsonc and are
      # merged into this run's checkout only, with the D1 id from a repository variable (not a secret). No
      # `wrangler d1 migrations apply`: the app's own runner applies migrations/ through the bridge.
      - name: Storage config (merge edge/storage.jsonc; D1 DB, R2 STORAGE in eu, Installation Durable Object)
        if: steps.token.outputs.set == 'true'
        env:
          APOTHEKE_D1_DATABASE_ID: ${{ vars.APOTHEKE_D1_DATABASE_ID }}
        run: node scripts/edge-storage-config.mjs edge/wrangler.jsonc edge/storage.jsonc
      - name: Deploy (Worker guard, then wrangler deploy of apotheke-api and its container only)
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf-deploy.sh apotheke-api edge
      # The custom domain is attached outside CI (before the flip); the first request may cold-start the container.
      - name: Smoke check (GET https://<first ALLOWED_HOSTS>/healthz is 200)
        if: steps.token.outputs.set == 'true'
        shell: bash
        run: |
          host=$(node -e 'const c=JSON.parse(require("fs").readFileSync("edge/wrangler.jsonc","utf8")); console.log(c.vars.ALLOWED_HOSTS.split(",")[0].trim())')
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "https://$host/healthz" || true)
            if [ "$code" = 200 ]; then echo "https://$host/healthz: 200"; exit 0; fi
            sleep 10
          done
          echo "::error title=Smoke check failed::https://$host/healthz did not answer 200 (last: $code). Roll back: unset EDGE_STORAGE_READY, then wrangler rollback (docs/deployment-and-operations.md#p4-edge-storage-flip-checklist)."
          exit 1
