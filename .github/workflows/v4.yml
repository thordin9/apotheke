name: v4

# Everything for experimental-v4. main keeps ci.yml; this workflow never runs for main.
on:
  pull_request:
    branches: [experimental-v4]
  push:
    branches: [experimental-v4]

permissions:
  contents: read

concurrency:
  group: v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # S0.2 adds v4/package.json and v4/package-lock.json. Until they are on the branch the build jobs
  # have nothing to run, so they are skipped rather than failed: a red run that means "S0.2 has not
  # landed" teaches nobody anything. They switch on by themselves with the commit that adds the
  # workspace. Both backend jobs now exist: `rqlite` landed with its driver (S0.8) and `d1` with
  # S0.6's last item. Neither needs a Cloudflare account: the D1 job runs the *emulated* binding,
  # which is SQLite under workerd, so it proves the binding and not hosted D1 (§5 states that limit).
  workspace:
    name: workspace present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f v4/package.json ] && [ -f v4/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v4/ workspace not on this branch yet (S0.2), build jobs skipped."
          fi

  typecheck-lint-unit:
    name: Typecheck, lint, unit (workerd)
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # S0.5: the route table in src/http/routes.generated.ts and its fixture are generated from the PHP
      # app's own routes artifact. This fails when either is stale, so the parity test cannot pass against
      # a table that has drifted from app/Config/Routes.php or app/Config/Filters.php.
      - run: npm run routes:check
      # S1.1: the served CSS/JS/icons are embedded from public/assets/, and the golden HTML fixture is
      # the PHP app's own output. Both checks fail when the committed artifact no longer matches its
      # source, so neither can pass against something that drifted. The fixture check hashes the PHP
      # files rather than rendering them: CI carries no PHP toolchain, and the script says so.
      - run: npm run assets:check
      - run: npm run fixtures:check
      # S1.6 (D36): the gate may not need PHP. This fails if a workflow that can run for this branch
      # gains a PHP setup step, a composer command or a PHP test runner - a check, not a promise. It runs
      # its own self-test first, so a parser that stops reading a trigger fails here rather than passing.
      - run: npm run workflows:check
      - run: npm test

  workerd-smoke:
    name: workerd smoke
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci
      - name: Boot and probe /healthz
        run: |
          set -euo pipefail
          npx wrangler dev --port 8799 --ip 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/healthz > health.json; then break; fi
            sleep 1
          done
          cat health.json
          test "$(jq -r .ok health.json)" = "true"
      # Unconditional on purpose: a step guarded by `if: failure()` is recorded as *skipped* on every
      # green run, and a skipped step inside a green run is exactly the shape that hides a probe that
      # did not execute. This one only ever prints dev.log.
      - name: Dump dev.log
        if: always()
        run: tail -n 100 dev.log || true

  # The third backend of G0 (plan §5, S0.6 + S0.8): a real rqlited on the runner, the same migration,
  # parity, seed and replay suites, and — the spike the phase-0 host could not finish — workerd talking
  # to it over loopback. A 503 during a leader election and the retry budget are exercised by the
  # driver's own specs; what this job adds is that the wire, the auth and the boot path are real.
  rqlite:
    name: rqlite (driver, parity, workerd boot)
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci

      # The build the phase-0 spikes measured (rqlited v10.7.4, SQLite 3.54.1). Pinned, not `latest`:
      # a new SQLite would make the parity fixture and this job disagree for no reason.
      - name: Install rqlited v10.7.4
        run: |
          set -euo pipefail
          curl -fsSL -o rqlite.tgz \
            https://github.com/rqlite/rqlite/releases/download/v10.7.4/rqlite-v10.7.4-linux-amd64.tar.gz
          tar xzf rqlite.tgz
          sudo install rqlite-v10.7.4-linux-amd64/rqlited /usr/local/bin/rqlited
          rqlited -version

      # With -auth on purpose: it is the default self-host posture (§11), and it is what makes the
      # driver's 401 path and `RQLITE_AUTH` parsing real rather than stubbed. The password is generated
      # per run and never stored anywhere but this job's environment.
      - name: Start rqlited with -auth
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 16)
          echo "RQLITE_AUTH=ci:$password" >> "$GITHUB_ENV"
          printf '[{"username":"ci","password":"%s","perms":["all"]}]\n' "$password" > auth.json
          rqlited -node-id ci -http-addr 127.0.0.1:4001 -raft-addr 127.0.0.1:4002 \
            -auth auth.json rqlite-data > rqlited.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -u "ci:$password" http://127.0.0.1:4001/status > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::rqlited did not answer /status"
          tail -n 50 rqlited.log
          exit 1

      - name: Runner, parity and seed tests against rqlite
        env:
          RQLITE_URL: http://127.0.0.1:4001
        run: |
          set -euo pipefail
          npm test -- --reporter=default --reporter=json --outputFile.json=test.json 2>&1 | tee test.log

      # A green run with the live specs skipped would say nothing about rqlite, which is how a backend
      # rots (§7). The reporter's JSON is what gets read: a log grep cannot tell a passed spec from a
      # skipped one, and grepping for the describe name finds nothing on a green run at all — the first
      # version of this step failed on a run where all six live specs had passed.
      - name: Assert the rqlite live specs ran
        run: |
          set -euo pipefail
          jq -e '([.testResults[] | select(.name | test("rqlite-live")) | .assertionResults[]]) as $t
                 | ($t | length) == 6 and ($t | map(.status) | unique) == ["passed"]' test.json
          jq -e '.numFailedTests == 0 and .numPendingTests == 0' test.json

      # The spike phase 0 could not finish: workerd → rqlited over loopback. `/healthz` proves the
      # Worker boots against this configuration; `/readyz` is the one that proves the fetch, because it
      # runs the whole migration chain and the seed phase over HTTP before answering 200.
      - name: Boot workerd against rqlited
        run: |
          set -euo pipefail
          npx wrangler dev --port 8799 --ip 127.0.0.1 \
            --var DB_DRIVER:rqlite \
            --var RQLITE_URL:http://127.0.0.1:4001 \
            --var "RQLITE_AUTH:$RQLITE_AUTH" > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/healthz > health.json; then break; fi
            sleep 1
          done
          cat health.json
          test "$(jq -r .ok health.json)" = "true"
          test "$(jq -r .driver health.json)" = "rqlite"
          for i in $(seq 1 60); do
            code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8799/readyz || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          cat ready.json
          test "$code" = "200"
          test "$(jq -r .schema ready.json)" = "0036"
          test "$(jq -r .seed ready.json)" = "done"

      - name: Dump logs
        if: always()
        run: |
          tail -n 100 dev.log || true
          tail -n 50 rqlited.log || true

  # G0's last CI leg (plan §5 S0.6): the D1 binding as Miniflare emulates it. Read the name before
  # reading the green tick — this is the **emulated** binding, not hosted D1, and §5 says where the
  # difference lands: a real D1 database is first created when an installation is provisioned, in
  # phase 1. No account, token, remote database or secret is involved in any step below.
  #
  # What it adds over the unit job (which already compares schema and seed rows on D1): the Worker
  # boots on the D1 binding and answers `/readyz`, so the migration chain, the seed phase and the
  # readiness gate run over `env.DB` in a real workerd process; and the emulated database file is
  # inspected afterwards, so FTS5 and D12's "the DO owns no data here" are checked against bytes
  # rather than inferred from a passing suite. §7's worry for this backend — a green job that
  # quietly tested nothing — is why every step asserts something specific.
  d1:
    name: d1 (emulated binding, parity, workerd boot)
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci

      - name: Parity and seed tests against the D1 driver
        run: |
          set -euo pipefail
          npm test -- --reporter=default --reporter=json --outputFile.json=test.json 2>&1 | tee test.log

      # Same rule as the rqlite job, adapted to what this job can honestly run: the two G0 files must
      # be all-passed and all eleven of their assertions must be there, nothing anywhere may fail, and
      # the *only* assertions allowed to be pending are the six rqlite live specs — this job has no
      # rqlited, and the rqlite job is where those run with numPendingTests == 0. Anything else
      # skipped fails here, so a spec cannot go quiet unnoticed.
      - name: Assert the D1 specs ran
        run: |
          set -euo pipefail
          jq -e '
            ([.testResults[] | {file: .name, a: .assertionResults[]}
              | select(.file | test("schema-parity|seed-parity")) | .a]) as $g0
            | ($g0 | length) == 11
              and ($g0 | map(.status) | unique) == ["passed"]
              and .numFailedTests == 0
              and ([.testResults[] | select((.name | test("rqlite-live")) | not)
                    | .assertionResults[] | select(.status != "passed")] | length) == 0
          ' test.json
          jq -r '"tests=\(.numTotalTests) failed=\(.numFailedTests) pending=\(.numPendingTests)"' test.json

      # From nothing, on purpose: the previous slice's red run (45278160385) failed here because a
      # spec had deliberately left a `9999` schema version behind. A boot that starts on a dirty
      # database proves nothing about a fresh install, and `npm test` keeps its state outside
      # `.wrangler`, so this removes only what an earlier boot of this job could have written.
      - name: Boot workerd on the D1 binding
        run: |
          set -euo pipefail
          rm -rf .wrangler
          npx wrangler dev --port 8799 --ip 127.0.0.1 --var DB_DRIVER:d1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/healthz > health.json; then break; fi
            sleep 1
          done
          cat health.json
          test "$(jq -r .ok health.json)" = "true"
          test "$(jq -r .driver health.json)" = "d1"
          # `/readyz` is the one that proves the binding: it runs the whole migration chain, the seed
          # phase and the readiness gate over `env.DB` before it can answer 200.
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8799/readyz || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          cat ready.json
          test "$code" = "200"
          test "$(jq -r .schema ready.json)" = "0036"
          test "$(jq -r .seed ready.json)" = "done"
          test "$(jq -r .driver ready.json)" = "d1"

      # Bytes, not inference. If the emulator ever loses FTS5, this names every object that went
      # missing against the PHP oracle instead of letting 0019's `optional` statements pass quietly;
      # the suite refuses the same way, and this says it about the database the app just wrote.
      - name: Inspect the emulated D1 database
        run: |
          set -euo pipefail
          db=$(find .wrangler/state/v3/d1 -name '*.sqlite' ! -name 'metadata.sqlite' | head -n 1)
          test -n "$db"
          echo "database: $db"

          applied=$(sqlite3 "$db" 'select count(*) from schema_migrations')
          echo "schema_migrations rows: $applied"
          test "$applied" = "36"

          expected=$(jq -r '.objects[].name | select(startswith("search_fts"))' \
            test/fixtures/php-v4.0.0-schema.json | sort)
          actual=$(sqlite3 "$db" "select name from sqlite_master where name like 'search_fts%'" | sort)
          echo "FTS5 objects expected (PHP oracle):"; echo "$expected"
          echo "FTS5 objects in the emulated D1 database:"; echo "$actual"
          diff <(echo "$expected") <(echo "$actual")

          # D12: under DB_DRIVER=d1 the Durable Object holds alarms and the migration lock only.
          do_db=$(find .wrangler/state/v3/do -name '*.sqlite' ! -name 'metadata.sqlite' | head -n 1)
          test -n "$do_db"
          app_tables=$(sqlite3 "$do_db" \
            "select count(*) from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf%' and name not like '__miniflare%'")
          echo "application tables in the DO's own storage: $app_tables"
          test "$app_tables" = "0"

      - name: Dump logs
        if: always()
        run: tail -n 100 dev.log || true

  # The third backend of §10, and the one the plan promises as the self-host default for a single
  # node: `DB_DRIVER=sqlite`, where the installation's Durable Object owns `ctx.storage.sql` (D12).
  #
  # Read what this leg adds before reading its green tick. The suite *already* runs on this driver in
  # every job — `wrangler.jsonc` sets `DB_DRIVER=sqlite` — so this is not the app's first proof on
  # sqlite; it is the driver's own. Three things existed nowhere else: an explicit driver rather than
  # an inherited default, the count rule applied to *this* leg (no job asserted that nothing but the
  # six rqlite live specs is pending here), and the database the DO wrote read as bytes rather than
  # inferred from a passing suite. `v4/docs/adapters.md` states what that proves and what it does
  # not: the engine is workerd's own SQLite, reached through DO storage, never a self-hoster's file.
  sqlite:
    name: sqlite (driver contract, workerd boot, database bytes)
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/package-lock.json
      - run: npm ci

      # Named, not inherited: `vitest.config.ts` carries DB_DRIVER into the test bindings when it is
      # set, so this leg proves the backend it says it proves. The evidence is still the Worker's own
      # answer — `health.spec.ts` asserts `{"driver":"sqlite"}` from /healthz — not the env var.
      - name: Suite on DB_DRIVER=sqlite
        env:
          DB_DRIVER: sqlite
        run: |
          set -euo pipefail
          npm test -- --reporter=default --reporter=json --outputFile.json=test.json 2>&1 | tee test.log

      # The count rule, stated so a quiet skip fails: only the six rqlite live specs may be pending
      # (there is no rqlited here) and all six must still be present, nothing else may be skipped or
      # failed, and the five contract specs `test/sqlite.spec.ts` adds must all have run. A file that
      # stopped being collected moves this count, which is the one thing a green step would hide.
      - name: Assert the sqlite run is complete
        run: |
          set -euo pipefail
          # `skipped` is the reporter's own word for an assertion that did not run; `.numPendingTests`
          # still counts it as pending, and reading the aggregate instead of the assertion is how a
          # skip check passes against a spec that never ran.
          jq -e '
            ([.testResults[] | select((.name | test("rqlite-live")) | not)
                | .assertionResults[] | select(.status != "passed")] | length) == 0
              and ([.testResults[] | select(.name | test("rqlite-live")) | .assertionResults[]] | length) == 6
              and ([.testResults[] | select(.name | test("rqlite-live")) | .assertionResults[]]
                    | map(.status) | unique) == ["skipped"]
              and ([.testResults[] | select(.name | test("sqlite")) | .assertionResults[]] | length) == 6
              and .numFailedTests == 0
          ' test.json
          jq -r '"files=\(.testResults | length) tests=\(.numTotalTests) failed=\(.numFailedTests) pending=\(.numPendingTests)"' test.json

      # From nothing, for the same reason as the d1 job: `npm test` keeps its state outside
      # `.wrangler`, so this removes only what an earlier boot of this job could have written. Every
      # probe is bounded — an app that accepts and never answers must cost seconds, not the job's
      # timeout (run 45367702792, and the smoke script's own header).
      - name: Boot workerd on DB_DRIVER=sqlite
        run: |
          set -euo pipefail
          rm -rf .wrangler
          npx wrangler dev --port 8799 --ip 127.0.0.1 --var DB_DRIVER:sqlite > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 --connect-timeout 3 http://127.0.0.1:8799/healthz > health.json; then break; fi
            sleep 1
          done
          cat health.json
          test "$(jq -r .ok health.json)" = "true"
          test "$(jq -r .driver health.json)" = "sqlite"
          # `/readyz` is the one that proves the driver: it runs the whole migration chain, the seed
          # phase and the readiness gate over the DO's storage before it can answer 200.
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 5 --connect-timeout 3 -o ready.json -w '%{http_code}' http://127.0.0.1:8799/readyz || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          cat ready.json
          test "$code" = "200"
          test "$(jq -r .schema ready.json)" = "0036"
          test "$(jq -r .seed ready.json)" = "done"
          test "$(jq -r .driver ready.json)" = "sqlite"

      # Bytes, not inference — and the exact inverse of the d1 job's last assertion. There, the DO's
      # file must hold **zero** application tables (D12: under d1 the database is `env.DB`). Here that
      # file *is* the database, so the same questions are asked of it: the 36 migrations, 0019's seven
      # `search_fts` objects against the PHP oracle, and the seeded install the app just wrote (one
      # active admin, 64 settings rows). SQLite recovers its WAL, so the file is read in place; the
      # check is what the app wrote, not a file-copy procedure — and that is also the limit, stated in
      # adapters.md: read the file with the `sqlite3` CLI, never with the app running beside it.
      - name: Inspect the DO's database file
        run: |
          set -euo pipefail
          db=$(find .wrangler/state/v3/do -name '*.sqlite' ! -name 'metadata.sqlite' | head -n 1)
          test -n "$db"
          echo "database: $db"

          applied=$(sqlite3 "$db" 'select count(*) from schema_migrations')
          echo "schema_migrations rows: $applied"
          test "$applied" = "36"

          settings=$(sqlite3 "$db" 'select count(*) from settings')
          echo "settings rows: $settings"
          test "$settings" = "64"

          admins=$(sqlite3 "$db" "select count(*) from users where role = 'admin' and status = 'active'")
          echo "active admins: $admins"
          test "$admins" = "1"

          # Measured 37 under this driver; `-ge 35` leaves room for an object appearing without
          # weakening the point, which is that the application schema is *here* and not in D1.
          tables=$(sqlite3 "$db" \
            "select count(*) from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf%' and name not like '__miniflare%'")
          echo "application tables in the DO's own storage: $tables"
          test "$tables" -ge 35

          # And the binding really went unused: no D1 database file beyond the emulator's metadata.
          stray=$(find .wrangler/state/v3/d1 -name '*.sqlite' ! -name 'metadata.sqlite' | wc -l)
          echo "D1 database files: $stray"
          test "$stray" = "0"

          expected=$(jq -r '.objects[].name | select(startswith("search_fts"))' \
            test/fixtures/php-v4.0.0-schema.json | sort)
          actual=$(sqlite3 "$db" "select name from sqlite_master where name like 'search_fts%'" | sort)
          echo "FTS5 objects expected (PHP oracle):"; echo "$expected"
          echo "FTS5 objects in the DO's database:"; echo "$actual"
          diff <(echo "$expected") <(echo "$actual")

      - name: Dump logs
        if: always()
        run: tail -n 100 dev.log || true

  # S0.9's packaging leg (plan §11 rule 8): both compose files, on a clean state, in the stack a
  # self-hoster actually runs. What makes this job honest is that neither the author's machine nor
  # the PM's has a Docker daemon — the compose files have only ever been checked by reading them, so
  # this is where they are first executed.
  #
  # What it does NOT prove: any published image. `apotheke` builds `v4/docker/Dockerfile.stub`, which
  # runs the real Worker under `wrangler dev` (real code, real migrations, real seed — dev tooling and
  # root, not a hardened container). The release image is P6, and docs/self-host-docker.md says so.
  # No account, token or published image is involved in any step.
  compose:
    name: compose (both files, stub image, /readyz, no re-seed)
    needs: workspace
    if: needs.workspace.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Asserted, not assumed: the smoke script fails when the CLI is missing, and this step says so
      # before spending ten minutes on image builds.
      - name: Docker present
        run: |
          set -euo pipefail
          docker version
          docker compose version

      # The two files are separate runs on purpose: each starts from `down -v`, so each proves its
      # own fresh install, and a failure names which stack broke.
      - name: Self-host smoke — rqlite (clean state, /readyz, second boot)
        run: scripts/selfhost-smoke.sh v4/docker-compose.yml

      - name: Self-host smoke — single process (clean state, /readyz, second boot)
        run: scripts/selfhost-smoke.sh v4/docker-compose.sqlite.yml

      - name: Dump docker state
        if: always()
        run: |
          docker ps -a || true
          docker volume ls || true
