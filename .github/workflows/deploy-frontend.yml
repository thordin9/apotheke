name: Deploy frontend

# The Worker getapotheke-app (edge/app/: routing, /config.json and headers) with frontend/dist as static assets:
# the landing page at / and the SPA under /app/.
# - Pull requests that touch it: build, Worker guard, typecheck and `wrangler deploy --dry-run`. No secrets, no previews.
# - Published releases (tags v*): the same build, then the deploy in the GitHub environment deploy-site (main and v* only).
# - workflow_dispatch on main or a v* tag: the same as a tag.
# Without the CLOUDFLARE_API_TOKEN secret, or without a frontend build yet, the deploy is skipped and the run stays green.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'edge/app/**'
      - 'edge/package.json'
      - 'edge/package-lock.json'
      - 'scripts/cf-worker-guard.mjs'
      - 'scripts/cf-deploy.sh'
      - '.github/workflows/deploy-frontend.yml'
  # A published GitHub Release (release.yml creates it with the release App's token, for tag vX.Y.Z). Not `push: tags`:
  # the tag points at the "chore(release): … [skip ci]" commit, and [skip ci] would suppress a tag-push run.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check (getapotheke-app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_build: ${{ steps.detect.outputs.has_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Is there a frontend build yet?
        id: detect
        run: |
          if [ -f frontend/package.json ] && node -e 'process.exit(require("./frontend/package.json").scripts?.build ? 0 : 1)'; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No frontend build::frontend/package.json has no build script yet; the dry run uses a stub and nothing is deployed."
          fi
      - name: Build frontend/ (npm ci && npm run build)
        if: steps.detect.outputs.has_build == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Stub dist (no frontend build yet)
        if: steps.detect.outputs.has_build != 'true'
        run: |
          mkdir -p frontend/dist/app
          printf '<!doctype html><title>Apotheke</title>\n' > frontend/dist/index.html
          printf '<!doctype html><title>Apotheke app</title>\n' > frontend/dist/app/index.html
      - name: Install the Worker tooling (edge/)
        working-directory: edge
        run: npm ci --no-audit --no-fund
      - name: Worker guard (allowlist; no routes, no custom domains)
        run: node scripts/cf-worker-guard.mjs getapotheke-app edge/app/wrangler.jsonc -- --dry-run
      - name: Types and typecheck
        working-directory: edge/app
        run: |
          npx --no-install wrangler types --check
          npx --no-install tsc --noEmit -p .
      - name: wrangler deploy --dry-run (no token, nothing uploaded)
        working-directory: edge/app
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/app-bundle"

  deploy:
    name: Deploy getapotheke-app
    needs: build
    # A published release (tag v*), or a manual run on main or a v* tag; never pull requests (so never forks).
    if: >-
      needs.build.outputs.has_build == 'true' &&
      ((github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy-site
    steps:
      - name: Mask the account id and check for the token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The deploy-site environment has no CLOUDFLARE_API_TOKEN secret; nothing was deployed."
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.set == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.set == 'true'
        with:
          node-version: '22'
      - name: Build frontend/ (npm ci && npm run build)
        if: steps.token.outputs.set == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install the Worker tooling (edge/)
        if: steps.token.outputs.set == 'true'
        working-directory: edge
        run: npm ci --no-audit --no-fund
      - name: Deploy (Worker guard, then wrangler deploy of getapotheke-app only)
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf-deploy.sh getapotheke-app edge/app
