name: Release

# After CI passes on a push to main, compute the next SemVer version from the Conventional Commits since the last
# tag, update VERSION, CHANGELOG.md and the README coverage table, commit "chore(release): vX.Y.Z [skip ci]",
# tag it and publish a GitHub Release. See docs/releasing.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog, tag and GitHub Release
    # The version commit, the tag and the GitHub Release are written with the release GitHub App's token (see
    # docs/releasing.md), so GITHUB_TOKEN stays read-only.
    # contents: read — check out the repository.
    # actions: read — download the coverage-ci4-sqlite artifact from the CI workflow.
    permissions:
      contents: read
      actions: read
    # The environment holds the App's client id and private key and only admits main.
    environment: release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # No token is left in .git/config; only the push step below gets the App token.
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Only release the commit CI tested
        id: guard
        run: |
          head=$(git rev-parse HEAD)
          if [ -n "$RUN_SHA" ] && [ "$head" != "$RUN_SHA" ]; then
            echo "main moved on ($head != $RUN_SHA); the newer commit's CI run releases it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan
        id: plan
        if: steps.guard.outputs.skip == 'false'
        run: php scripts/release.php plan --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Refresh README coverage table from the CI artifact
        if: steps.plan.outputs.release == 'true' && env.RUN_ID != ''
        run: |
          if gh run download "$RUN_ID" -n coverage-ci4-sqlite -D "$RUNNER_TEMP/coverage"; then
            php scripts/coverage-readme.php "$RUNNER_TEMP/coverage"
          else
            echo "::warning::coverage-ci4-sqlite artifact not found; README coverage table left as is"
          fi
      - name: Update VERSION and CHANGELOG.md, commit and tag
        if: steps.plan.outputs.release == 'true'
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          php scripts/release.php apply --notes="$RUNNER_TEMP/notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md README.md
          git commit -m "chore(release): v$NEXT [skip ci]"
          git tag -a "v$NEXT" -m "v$NEXT"
      # Only when there is something to release, right before the push: the release GitHub App's installation
      # token (Contents write, revoked when the job ends), which the main ruleset lets through.
      - name: Release App token
        id: app-token
        if: steps.plan.outputs.release == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the release commit and tag
        if: steps.plan.outputs.release == 'true'
        env:
          NEXT: ${{ steps.plan.outputs.next }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The App token goes to git through the environment (not argv, not .git/config) and is never printed;
          # its base64 form is masked before it is used.
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git push --atomic origin HEAD:main "v$NEXT"
      - name: GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT: ${{ steps.plan.outputs.next }}
        run: gh release create "v$NEXT" --title "v$NEXT" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
