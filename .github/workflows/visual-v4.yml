name: Visual v4 instrument

# The one-pixel control (D51): boots v4 through tests/visual/v4-server.cjs, renders /login in the
# pinned Playwright build, compares the pixels against the committed v3 baseline, and proves the
# comparison is alive and located by planting exactly one pixel at a known coordinate.
#
# It is an instrument, never a gate (D49): what it prints - how far v4's login is from the v3
# baseline - is data for G1, not a required check. The step fails only when the instrument itself is
# broken (no boot, no render, or a plant the comparison cannot locate).
#
# Why the push trigger on one branch, when D51 said dispatch-only: a new workflow file cannot be
# dispatched until it exists on the default branch, and main is frozen at 4a187d0f. So the dispatch
# I can actually fire, and read, on this branch is a push to `v4/visual-instrument`. It runs nowhere
# else, gates nothing, and costs one run when someone wants an instrument reading.

on:
  workflow_dispatch:
  push:
    branches: [v4/visual-instrument, v4/g1-map]

permissions:
  contents: read

jobs:
  instrument:
    name: Boot v4, render /login, locate a planted pixel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # The container the baselines were rendered in (scripts/update-snapshots.sh, snapshots.yml):
      # a different browser build renders different pixels, and the comparison would be noise.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      CI: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: The container's Node is new enough for wrangler
        run: |
          node --version
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a < 22 || (a === 22 && b < 12)) { console.error('node ' + process.versions.node + ' is older than v4/package.json\'s engines (>=22.12.0)'); process.exit(1); }"
      # The pinned @playwright/test for the comparison, and wrangler for the boot: two installs, one
      # per package.json, because the visual harness belongs to the repo root and v4 to v4/.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: v4
      - name: Self-test the instrument (no browser, no boot)
        run: node v4/scripts/visual-v4-instrument.mjs --self-test
      - name: Boot v4 through the harness's seam and locate the planted pixel
        run: node v4/scripts/visual-v4-instrument.mjs
      # G1's seeding step, exercised by the one spec whose page v4 serves today: the harness's `reset`
      # now reseeds v4 through v4 (a wiped persist directory and v4's own migrate+seed on /readyz), so
      # this test boots, resets, renders /login and completes. `--update-snapshots=all` is deliberate:
      # the committed login baseline predates 1f86dd66's palette (D53/D55), so a comparison here would
      # report the re-baseline rather than whether the reset ran - the step above is what compares pixels.
      # A php process here would fail the step by itself: the container has none.
      - name: One real spec under E2E_APP=v4 (the reset path)
        env:
          E2E_APP: v4
        run: npx playwright test visual-login.spec.ts --project=desktop-chromium --update-snapshots=all --reporter=list
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-v4-instrument
          path: tests/visual/results/visual-v4-instrument/
          if-no-files-found: warn
          retention-days: 14

  map:
    # D49: the CI4_UNPORTED map comes from a run, never from a hand. This job boots v4 once per test,
    # runs one device's copy of every spec against it, and lets v4/scripts/visual-v4-map.mjs turn each
    # 501 (v4's answer for a page no slice has ported) and each refusing fixture into a map entry.
    # One device is enough: the key is "<spec file>: <describe> > <title>", the same for every project.
    #
    # It never gates. The expected output of this run is a suite that is mostly skips and refusals, so
    # a red here is a statement about the port, not about the change that triggered it.
    name: Harvest the CI4_UNPORTED map under E2E_APP=v4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      CI: '1'
      HOME: /root
      E2E_APP: v4
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: v4
      - name: Run every spec against v4 and record what it answers
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/visual/v4-map-report.json
        run: npx playwright test --project=desktop-chromium --retries=0 --reporter=json
      - name: Harvest the map from the report
        continue-on-error: true
        run: node v4/scripts/visual-v4-map.mjs tests/visual/v4-map-report.json --write tests/visual/ci4-unported.proposed.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-v4-map
          path: |
            tests/visual/v4-map-report.json
            tests/visual/ci4-unported.proposed.json
          if-no-files-found: warn
          retention-days: 14
