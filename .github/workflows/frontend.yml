name: Frontend

# Landing site. A pull request or a push to main runs it when frontend/ changes.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'tests/e2e/consent.spec.ts'
      - 'tests/e2e/app.spec.ts'
      - 'tests/e2e/consent-server.mjs'
      - 'tests/e2e/playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'tests/e2e/consent.spec.ts'
      - 'tests/e2e/app.spec.ts'
      - 'tests/e2e/consent-server.mjs'
      - 'tests/e2e/playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Contrast
        run: node frontend/scripts/contrast.mjs
      - name: Consent cookie and app fallback
        run: node --test frontend/scripts/consent.test.mjs frontend/scripts/app-fallback.test.mjs
      - name: Dist layout, headers and links
        run: node frontend/scripts/check-dist.mjs
      - name: Install the end-to-end runner
        run: npm ci
      - name: Frontend end-to-end
        run: npx playwright install --with-deps chromium && npx playwright test -c tests/e2e/playwright.config.ts
