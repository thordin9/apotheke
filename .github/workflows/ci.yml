name: CI

# pull_request has no branch filter, so pull requests into feature/ci4 run this
# workflow. Pushes run it for main and, once this file is on the branch, feature/ci4.
on:
  pull_request:
  push:
    branches: [main, feature/ci4]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Lint PHP, JS and shell scripts
        run: bash scripts/lint.sh

  deptrac:
    name: deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Module graph
        run: php scripts/ci4-arch.php deptrac

  di-rule:
    name: DI rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, mbstring, sqlite3
          tools: composer:v2
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install CI4 dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --working-dir=ci4
      - name: Audit CI4 dependencies
        run: composer audit --no-interaction --working-dir=ci4
      - name: Constructor injection
        run: php scripts/ci4-arch.php di

  test:
    name: Tests (${{ matrix.app }} @ PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.4 × both apps. scripts/ci4-leg.sh accepts only legacy and ci4.
        # legacy@8.4 runs the same PHPUnit suite as legacy@8.3.
        # Lint, mobile, Playwright and Docker also run on 8.3 and 8.4.
        app: [legacy, ci4]
        php: ['8.4']
        db: [sqlite, pgsql]
        include:
          # legacy@8.3 is the shipped 2.5.x image: the upgrade/rollback reference.
          - app: legacy
            php: '8.3'
            db: sqlite
          - app: legacy
            php: '8.3'
            db: pgsql
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          # Test-only password. The backslash is what the CI4 /healthz check connects with.
          POSTGRES_PASSWORD: 'apotheke\test'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: ${{ matrix.db }}
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: '5432'
      TEST_PG_DB: apotheke
      TEST_PG_USER: apotheke
      TEST_PG_PASSWORD: 'apotheke\test'
      APOTHEKE_APP: ${{ matrix.app }}
      APOTHEKE_TEST_DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, pdo_pgsql, pgsql, sqlite3, intl, exif, mbstring, dom, zip, imagick
          coverage: pcov
          tools: composer:v2
      - name: Decide whether this leg runs the suite
        id: suite
        run: bash scripts/ci4-leg.sh "${{ matrix.app }}" . >> "$GITHUB_OUTPUT"
      - name: Composer cache dir
        id: composer-cache
        if: steps.suite.outputs.run == 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.suite.outputs.run == 'true'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock', 'ci4/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Install zbar (QR round-trip tests)
        if: steps.suite.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zbar-tools
      - name: Install dev dependencies
        if: steps.suite.outputs.run == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install CI4 dependencies
        if: steps.suite.outputs.run == 'true' && matrix.php == '8.4'
        run: composer install --no-interaction --no-progress --prefer-dist --working-dir=ci4
      - name: Migrations via CLI (fresh database + idempotent re-run + seed)
        if: steps.suite.outputs.run == 'true'
        run: |
          export DATA_DIR="$RUNNER_TEMP/cli-data" DB_HOST=127.0.0.1 DB_SCHEMA=ci_cli
          export DB_PASSWORD="$TEST_PG_PASSWORD"
          php bin/migrate.php
          php bin/migrate.php | grep -q 'Already up to date'
          php bin/seed.php --demo
          php bin/seed.php --demo | grep -q 'Demo items created: 0'
          php bin/migrate.php --status
      - name: PHPUnit (unit + HTTP integration)
        if: steps.suite.outputs.run == 'true'
        run: vendor/bin/phpunit --log-junit "$RUNNER_TEMP/junit.xml"
      - name: Prove CI4 used PostgreSQL
        if: steps.suite.outputs.run == 'true' && matrix.app == 'ci4' && matrix.db == 'pgsql'
        run: php scripts/ci4-pgsql-proof.php
      - uses: actions/setup-node@v4
        if: steps.suite.outputs.run == 'true' && matrix.app == 'legacy' && matrix.php == '8.3' && matrix.db == 'sqlite'
        with:
          node-version: '20'
          cache: npm
      - name: Coverage (unit + HTTP suites merged, Playwright test counts)
        if: steps.suite.outputs.run == 'true' && matrix.app == 'legacy' && matrix.php == '8.3' && matrix.db == 'sqlite'
        run: |
          npm ci --no-audit --no-fund
          bash scripts/coverage.sh --no-readme
          php scripts/coverage-readme.php coverage --print >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report (clover XML + HTML; used by the release workflow)
        if: steps.suite.outputs.run == 'true' && matrix.app == 'legacy' && matrix.php == '8.3' && matrix.db == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sqlite
          path: |
            coverage/*.xml
            coverage/*.txt
            coverage/playwright-list.json
            coverage/html/
          if-no-files-found: error

  mobile-checks:
    name: Headless mobile checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, exif, mbstring, zip
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install puppeteer-core
        run: npm ci --prefix tests/e2e
      - name: Start app and seed demo data
        run: |
          mkdir -p /tmp/e2e-data
          DATA_DIR=/tmp/e2e-data php -S 127.0.0.1:9091 -t public public/index.php > /tmp/e2e-server.log 2>&1 &
          sleep 1
          php tests/e2e/seed.php http://127.0.0.1:9091
      - name: Run mobile checks (375×667, 390×844)
        run: CHROME="$(command -v google-chrome)" node tests/e2e/mobile.mjs http://127.0.0.1:9091
      - name: Server log
        if: always()
        run: cat /tmp/e2e-server.log || true

  e2e:
    name: Visual E2E (Playwright, PHP ${{ matrix.php }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as scripts/update-snapshots.sh, so screenshots match the committed baselines pixel for pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
          POSTGRES_DB: apotheke
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      HOME: /root
      TEST_PG_HOST: postgres
      TEST_PG_PASSWORD: apotheke
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP ${{ matrix.php }}
        run: scripts/e2e-container-setup.sh "${{ matrix.php }}"
      - name: Install Playwright test runner
        run: npm ci --no-audit --no-fund
      - name: Run Playwright
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload HTML report, traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-php-${{ matrix.php }}-shard-${{ matrix.shard }}
          path: |
            tests/visual/report/
            tests/visual/results/
          retention-days: 14

  docker:
    name: Docker build + smoke test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: apotheke:ci
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}
      - name: Image size
        run: docker image ls apotheke:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HEIC (Imagick lists HEIC) and startup refusal
        run: bash scripts/docker-heic.sh apotheke:ci
      - name: Run container (SQLite)
        run: docker run -d --name apotheke -p 9091:9091 apotheke:ci
      - name: Smoke test SQLite (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:9091
      - name: Web server checks (routing, blocked paths, headers, gzip, body limits)
        run: bash scripts/docker-checks.sh http://127.0.0.1:9091
      - name: Run container (PostgreSQL)
        run: |
          docker run -d --name apotheke-pg --network host -e PORT=8081 \
            -e DB_DRIVER=pgsql -e DB_HOST=127.0.0.1 -e DB_NAME=apotheke -e DB_USER=apotheke -e DB_PASSWORD=apotheke \
            apotheke:ci
      - name: Smoke test PostgreSQL (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:8081
      - name: Graceful stop (SIGTERM reaches nginx and php-fpm, exit code 0)
        run: |
          start=$(date +%s)
          docker stop -t 20 apotheke
          code=$(docker inspect -f '{{.State.ExitCode}}' apotheke)
          echo "stopped in $(( $(date +%s) - start ))s with exit code $code"
          test "$code" = 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Playwright @smoke E2E against the image
        env:
          E2E_DOCKER_IMAGE: apotheke:ci
          CI: '1'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=docker-smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docker-php-${{ matrix.php }}
          path: |
            tests/visual/report/
            tests/visual/results/
          retention-days: 14
      - name: Container logs
        if: always()
        run: |
          docker logs apotheke || true
          docker logs apotheke-pg || true

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Pinned gitleaks CLI (not the org-licensed GitHub Action). No token or license.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "pinned gitleaks build is linux x64; this runner is $(uname -m)" >&2
            exit 1
          fi
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          tmp="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$tmp"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/$file" "$url"
          echo "${expected}  $tmp/$file" | sha256sum -c -
          tar -xzf "$tmp/$file" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1
