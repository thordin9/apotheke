name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Lint PHP, JS and shell scripts
        run: bash scripts/lint.sh

  test:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, exif, mbstring
          coverage: none
          tools: none
      - name: Run integration tests
        run: php tests/integration.php

  e2e:
    name: Headless mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, exif, mbstring
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install puppeteer-core
        run: npm ci --prefix tests/e2e
      - name: Start app and seed demo data
        run: |
          mkdir -p /tmp/e2e-data
          DATA_DIR=/tmp/e2e-data php -S 127.0.0.1:8080 -t public public/index.php > /tmp/e2e-server.log 2>&1 &
          sleep 1
          php tests/e2e/seed.php http://127.0.0.1:8080
      - name: Run mobile checks (375×667, 390×844)
        run: CHROME="$(command -v google-chrome)" node tests/e2e/mobile.mjs http://127.0.0.1:8080
      - name: Server log
        if: always()
        run: cat /tmp/e2e-server.log || true

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: apotheke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --name apotheke -p 8080:80 apotheke:ci
      - name: Smoke test (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Container logs
        if: always()
        run: docker logs apotheke || true

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
