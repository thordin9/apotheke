name: CI

# D36 (plan revision 41): the legacy PHP test system retired from the v4 line, so this workflow keeps
# only the two jobs that say something about a frozen v3 tree without a PHP toolchain - the
# commit-message rule and the secret scan. The other ten (lint, deptrac, di-rule, d1-local, test,
# mobile-checks, e2e, docker, compose, upgrade-rollback) needed PHP or a PHP image; main's copy of this
# file still has them, because main keeps the whole v3 suite until cutover and a revert or security
# hotfix there must still have its regression net.
#
# Do not add a PHP job here: v4/scripts/check-workflows-php-free.mjs fails v4's unit job when a
# workflow that can run for experimental-v4 gains one, and a pull request into that branch runs this
# file (its pull_request trigger has no branch filter).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every PR commit
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Pinned gitleaks CLI (not the org-licensed GitHub Action). No token or license.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "pinned gitleaks build is linux x64; this runner is $(uname -m)" >&2
            exit 1
          fi
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          tmp="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$tmp"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/$file" "$url"
          echo "${expected}  $tmp/$file" | sha256sum -c -
          tar -xzf "$tmp/$file" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1
