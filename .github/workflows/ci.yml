name: CI

# pull_request has no branch filter, so every pull request runs this workflow.
# Pushes run it for main, the one line of development; a green push to main starts the release workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Lint PHP, JS and shell scripts
        run: bash scripts/lint.sh

  deptrac:
    name: deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Module graph
        run: php scripts/ci4-arch.php deptrac

  di-rule:
    name: DI rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, mbstring, sqlite3
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit dependencies
        run: composer audit --no-interaction
      - name: Constructor injection
        run: php scripts/ci4-arch.php di

  test:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.0 requires PHP ^8.4 (composer.json). The legacy app is tested on its own branch;
        # the upgrade-rollback job below runs the v2.6.26 reference.
        php: ['8.4']
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          # Test-only password. The backslash is what the CI4 /healthz check connects with.
          POSTGRES_PASSWORD: 'apotheke\test'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: ${{ matrix.db }}
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: '5432'
      TEST_PG_DB: apotheke
      TEST_PG_USER: apotheke
      TEST_PG_PASSWORD: 'apotheke\test'
      APOTHEKE_APP: ci4
      APOTHEKE_TEST_DB: ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, pdo_pgsql, pgsql, sqlite3, intl, exif, mbstring, dom, zip, imagick, sodium
          coverage: pcov
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Install zbar (QR round-trip tests) and the HEIC decoder
        # A hung mirror once kept this step running for hours. Each apt call gets its own timeout,
        # the whole install is retried 3 times, and the step itself stops after 15 minutes.
        timeout-minutes: 15
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # MediaTest converts a real HEIC (CI=true fails instead of skipping without a decoder).
          pkgs=(zbar-tools libheif-plugin-libde265)
          for i in 1 2 3; do
            if timeout 120 sudo apt-get "${apt_opts[@]}" update -qq \
              && timeout 180 sudo apt-get "${apt_opts[@]}" install -y -qq "${pkgs[@]}"; then
              exit 0
            fi
            echo "${pkgs[*]} install failed (attempt $i/3)" >&2
            [ "$i" -lt 3 ] && sleep $((i * 15))
          done
          exit 1
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Migrations via CLI (fresh database + idempotent re-run + seed)
        run: |
          export DATA_DIR="$RUNNER_TEMP/cli-data" DB_HOST=127.0.0.1 DB_SCHEMA=ci_cli
          export DB_PASSWORD="$TEST_PG_PASSWORD"
          php bin/migrate.php
          php bin/migrate.php | grep -q 'Already up to date'
          php bin/seed.php --demo
          php bin/seed.php --demo | grep -q 'Demo items created: 0'
          php bin/migrate.php --status
      - name: PHPUnit (root suite; it also runs the module suite)
        if: matrix.db == 'pgsql'
        run: vendor/bin/phpunit --log-junit "$RUNNER_TEMP/junit.xml"
      - name: Prove the real-HEIC Media test runs
        run: |
          php -r 'echo "Imagick HEIC/HEIF: ", json_encode(Imagick::queryFormats("HEI*")), PHP_EOL;'
          vendor/bin/phpunit -c tests/Modules/phpunit.xml.dist --filter 'MediaTest::testARealHeic' --fail-on-skipped --fail-on-empty-test-suite --testdox
      - name: Autofill and Media suites with allow_url_fopen off (L-270, N-281)
        run: php -d allow_url_fopen=0 vendor/bin/phpunit -c tests/Modules/phpunit.xml.dist --fail-on-skipped --fail-on-empty-test-suite --testdox tests/Modules/Autofill tests/Modules/Media
      - name: Prove the suite used PostgreSQL
        if: matrix.db == 'pgsql'
        run: php scripts/ci4-pgsql-proof.php
      - uses: actions/setup-node@v4
        if: matrix.db == 'sqlite'
        with:
          node-version: '20'
          cache: npm
      - name: PHPUnit with coverage (module and root suites and their php -S requests, Playwright test counts)
        if: matrix.db == 'sqlite'
        run: |
          npm ci --no-audit --no-fund
          PHPUNIT_ARGS="--log-junit $RUNNER_TEMP/junit.xml" bash scripts/coverage.sh --no-readme
          php scripts/coverage-readme.php coverage --print >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report (clover XML + HTML; used by the release workflow)
        if: matrix.db == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ci4-sqlite
          path: |
            coverage/*.xml
            coverage/*.txt
            coverage/playwright-list.json
            coverage/html/
          if-no-files-found: error

  mobile-checks:
    name: Headless mobile checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, exif, mbstring, zip, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - uses: actions/setup-node@v4
        with:
          # puppeteer-core 25 needs Node 22.12 or later.
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install puppeteer-core
        run: npm ci --prefix tests/e2e
      - name: Start app and seed demo data
        run: |
          mkdir -p /tmp/e2e-data
          DATA_DIR=/tmp/e2e-data php -S 127.0.0.1:9091 -t public public/router.php > /tmp/e2e-server.log 2>&1 &
          sleep 1
          php tests/e2e/seed.php http://127.0.0.1:9091
      - name: Run mobile checks (375×667, 390×844)
        run: CHROME="$(command -v google-chrome)" node tests/e2e/mobile.mjs http://127.0.0.1:9091
      - name: Server log
        if: always()
        run: cat /tmp/e2e-server.log || true

  e2e:
    name: Visual E2E (Playwright, PHP ${{ matrix.php }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as scripts/update-snapshots.sh, so screenshots match the committed baselines pixel for pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
          POSTGRES_DB: apotheke
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      HOME: /root
      TEST_PG_HOST: postgres
      TEST_PG_PASSWORD: apotheke
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP ${{ matrix.php }}
        run: scripts/e2e-container-setup.sh "${{ matrix.php }}"
      - name: Install Playwright test runner
        run: npm ci --no-audit --no-fund
      # Specs that need an unported page skip (CI4_UNPORTED in tests/visual/fixtures.ts, listed in docs/HANDOFF.md).
      - name: Install the runtime (intl, Composer, vendor)
        run: |
          apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends php8.4-intl >/dev/null
          # shellcheck disable=SC2016 # PHP code, expanded by php
          php -r '$f = "/usr/local/bin/composer"; copy("https://getcomposer.org/download/2.10.3/composer.phar", $f);
            if (hash_file("sha256", $f) !== "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6") { unlink($f); fwrite(STDERR, "composer.phar checksum mismatch\n"); exit(1); }
            chmod($f, 0755);'
          composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Run Playwright (ported pages)
        env:
          E2E_APP: ci4
        run: >-
          npx playwright test --shard=${{ matrix.shard }}/3
          tests/visual/list.spec.ts tests/visual/search.spec.ts tests/visual/saved-filters.spec.ts
          tests/visual/favourites.spec.ts tests/visual/value.spec.ts tests/visual/manage.spec.ts
          tests/visual/locations-nested.spec.ts tests/visual/theme.spec.ts tests/visual/errors.spec.ts
          tests/visual/originals.spec.ts tests/visual/branding.spec.ts
          tests/visual/add.spec.ts tests/visual/item.spec.ts tests/visual/undo.spec.ts
          tests/visual/history.spec.ts tests/visual/expiry.spec.ts tests/visual/photos.spec.ts
          tests/visual/bulk.spec.ts tests/visual/merge.spec.ts tests/visual/duplicate.spec.ts
          tests/visual/stock.spec.ts tests/visual/attachments.spec.ts tests/visual/users.spec.ts
          tests/visual/roles.spec.ts tests/visual/labels.spec.ts tests/visual/barcode.spec.ts
          tests/visual/lending.spec.ts tests/visual/stocktake.spec.ts tests/visual/import.spec.ts
          tests/visual/data.spec.ts tests/visual/control-panel.spec.ts tests/visual/autofill-settings.spec.ts
          tests/visual/auth.spec.ts tests/visual/qa-fixes.spec.ts tests/visual/qa-v2.spec.ts
      - name: Upload HTML report, traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-php-${{ matrix.php }}-shard-${{ matrix.shard }}
          path: |
            tests/visual/report/
            tests/visual/results/
          retention-days: 14

  docker:
    name: Docker build + smoke test (PHP ${{ matrix.php }}${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # The exact PHP patch, passed as the PHP_VERSION build-arg. It is the shipped
        # default (ARG PHP_VERSION in both Dockerfiles) and must match it.
        # Two images from the same code: nginx + php-fpm (Dockerfile) and FrankenPHP (Dockerfile.frankenphp).
        # The nginx leg keeps its check name (label '').
        include:
          - php: '8.4'
            php_patch: '8.4.27'
            dockerfile: Dockerfile
            from: 'php:${PHP_VERSION}-fpm-alpine'
            label: ''
            server: nginx
          - php: '8.4'
            php_patch: '8.4.27'
            dockerfile: Dockerfile.frankenphp
            from: 'dunglas/frankenphp:${FRANKENPHP_VERSION}-php${PHP_VERSION}-alpine AS php'
            label: ', FrankenPHP'
            server: frankenphp
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: apotheke:ci
          build-args: |
            PHP_VERSION=${{ matrix.php_patch }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.server }}
      - name: Assert the image runs the pinned PHP patch
        env:
          BUILT: ${{ matrix.php_patch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          FROM_PHP: ${{ matrix.from }}
        run: |
          set -euo pipefail
          # The pin is the ARG PHP_VERSION default; the FROM line of the PHP base must use it.
          # Instruction keywords are case-insensitive, as in Docker.
          pins=$(sed -nE 's/^[Aa][Rr][Gg] PHP_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$DOCKERFILE")
          if [ -z "$pins" ] || [ "$(printf '%s\n' "$pins" | wc -l)" -ne 1 ]; then
            echo "$DOCKERFILE does not pin exactly one ARG PHP_VERSION=X.Y.Z" >&2
            exit 1
          fi
          pin=$pins
          # Exactly one FROM line uses the PHP base image, and it is the pinned one (matrix.from):
          # php:${PHP_VERSION}-fpm-alpine (nginx) or dunglas/frankenphp:…-php${PHP_VERSION}-alpine (FrankenPHP).
          base=${FROM_PHP%%:*}
          froms=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              [Ff][Rr][Oo][Mm]" $base:"*)
                froms=$((froms + 1))
                if [ "${line#* }" != "$FROM_PHP" ]; then
                  echo "$DOCKERFILE FROM line does not use the pinned ARG PHP_VERSION: $line" >&2
                  exit 1
                fi
                ;;
            esac
          done < "$DOCKERFILE"
          if [ "$froms" -ne 1 ]; then
            echo "$DOCKERFILE needs exactly one FROM $FROM_PHP line" >&2
            exit 1
          fi
          # The default must be what the same-minor leg builds, so a bump can't skip CI.
          if [ "${BUILT%.*}" = "${pin%.*}" ] && [ "$BUILT" != "$pin" ]; then
            echo "$DOCKERFILE default $pin differs from the $BUILT build-arg in ci.yml" >&2
            exit 1
          fi
          # Check the patch this leg actually built (the build-arg), not a fixed value.
          pin=$BUILT
          if ! docker run --rm -e PIN="$pin" apotheke:ci php -r 'echo "PHP_VERSION=".PHP_VERSION, PHP_EOL; exit(version_compare(PHP_VERSION, getenv("PIN"), "==") ? 0 : 1);'; then
            echo "expected $pin" >&2
            exit 1
          fi
      - name: pcntl (jobs:work stops cleanly on SIGTERM, L-1241)
        run: docker run --rm apotheke:ci php -m | grep -qx pcntl
      - name: Image size
        run: docker image ls apotheke:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HEIC, ImageMagick policy and startup refusal
        run: bash scripts/docker-heic.sh apotheke:ci
      - name: Sign-in required at start (SEC-M3; refuses without APP_PASSWORD, starts with it or ALLOW_NO_LOGIN=1)
        run: bash scripts/docker-signin-checks.sh apotheke:ci
      - name: Run container (SQLite)
        run: docker run -d --name apotheke -p 9091:9091 -e ALLOW_NO_LOGIN=1 apotheke:ci
      - name: Smoke test SQLite (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:9091
      - name: The web server and PHP run as www-data, never root (tini and the entrypoint only start them)
        env:
          SERVER: ${{ matrix.server }}
        run: |
          set -euo pipefail
          docker exec apotheke ps -o user,args > ps.txt
          cat ps.txt
          case "$SERVER" in
            nginx) procs='php-fpm: pool|nginx: worker' ;;
            frankenphp) procs='frankenphp run' ;;
          esac
          grep -E "$procs" ps.txt | grep -v '^root ' | grep -q .
          if grep -E "$procs" ps.txt | grep -E '^root ' | grep -v 'php-fpm: master\|nginx: master'; then
            echo "a request-serving process runs as root" >&2
            exit 1
          fi
      - name: FrankenPHP threads (FRANKENPHP_NUM_THREADS, default 2, 1-64)
        if: matrix.server == 'frankenphp'
        run: |
          set -euo pipefail
          docker logs apotheke 2>&1 | grep -F 'frankenphp on :9091 (/var/www/app/public), 2 PHP threads'
          for bad in 0 65 abc; do
            code=0
            docker run --rm -e ALLOW_NO_LOGIN=1 -e FRANKENPHP_NUM_THREADS="$bad" apotheke:ci > out.txt 2>&1 || code=$?
            test "$code" = 64 || { cat out.txt; echo "FRANKENPHP_NUM_THREADS=$bad: exit $code, expected 64" >&2; exit 1; }
          done
          docker run -d --name apotheke-threads -p 9095:9091 -e ALLOW_NO_LOGIN=1 -e FRANKENPHP_NUM_THREADS=4 apotheke:ci
          for _ in $(seq 1 50); do curl -fs -o /dev/null http://127.0.0.1:9095/healthz && break; sleep 0.2; done
          curl -fsS -o /dev/null http://127.0.0.1:9095/healthz
          docker logs apotheke-threads 2>&1 | grep -F ', 4 PHP threads'
          docker rm -f apotheke-threads >/dev/null
      - name: HEALTHCHECK turns healthy
        run: |
          set -euo pipefail
          test -n "$(docker inspect -f '{{json .Config.Healthcheck}}' apotheke:ci | grep -F healthz)"
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' apotheke)" = healthy ] && exit 0
            sleep 2
          done
          docker inspect -f '{{json .State.Health}}' apotheke
          exit 1
      - name: Web server checks (routing, blocked paths, headers, gzip, body limits)
        run: bash scripts/docker-checks.sh http://127.0.0.1:9091
      - name: Sign-in mode checks (sessions on demand, restore limit after sign-in)
        run: |
          set -euo pipefail
          APP_PW=$(openssl rand -hex 16)
          export APP_PW
          docker run -d --name apotheke-auth -p 9092:9092 -e PORT=9092 -e APP_PASSWORD="$APP_PW" apotheke:ci
          for _ in $(seq 1 50); do curl -fs -o /dev/null http://127.0.0.1:9092/healthz && break; sleep 0.2; done
          bash scripts/docker-auth-checks.sh http://127.0.0.1:9092
          docker rm -f apotheke-auth >/dev/null
      - name: Run container (PostgreSQL)
        run: |
          docker run -d --name apotheke-pg --network host -e PORT=8081 -e ALLOW_NO_LOGIN=1 \
            -e DB_DRIVER=pgsql -e DB_HOST=127.0.0.1 -e DB_NAME=apotheke -e DB_USER=apotheke -e DB_PASSWORD=apotheke \
            apotheke:ci
      - name: Smoke test PostgreSQL (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:8081
      - name: Graceful stop (SIGTERM reaches the web server and PHP, exit code 0)
        run: |
          start=$(date +%s)
          docker stop -t 20 apotheke
          code=$(docker inspect -f '{{.State.ExitCode}}' apotheke)
          echo "stopped in $(( $(date +%s) - start ))s with exit code $code"
          test "$code" = 0
      - name: Sign-in on with SIGN_IN_FAIL_MS (sessions on demand, failed sign-in pacing)
        run: |
          set -euo pipefail
          APP_PW=$(openssl rand -hex 16)
          export APP_PW
          docker run -d --name apotheke-auth-ms -p 9094:9094 -e PORT=9094 -e SIGN_IN_FAIL_MS=1500 \
            -e APP_PASSWORD="$APP_PW" apotheke:ci
          for _ in $(seq 1 50); do curl -fs -o /dev/null http://127.0.0.1:9094/healthz && break; sleep 0.2; done
          FAIL_MS=1500 bash scripts/docker-auth-checks.sh http://127.0.0.1:9094
          docker rm -f apotheke-auth-ms >/dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Playwright @smoke E2E against the image
        env:
          E2E_DOCKER_IMAGE: apotheke:ci
          CI: '1'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=docker-smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-docker-php-${{ matrix.php }}-${{ matrix.server }}
          path: |
            tests/visual/report/
            tests/visual/results/
          retention-days: 14
      - name: Container logs
        if: always()
        run: |
          docker logs apotheke || true
          docker logs apotheke-pg || true

  # Self-hosting with docker compose, as docs/getting-started.md and docs/deployment-and-operations.md describe it,
  # for both images: the port is published on 127.0.0.1 only, a new install refuses to start without APP_PASSWORD
  # (SEC-M3), starts with it, signs in, and the PostgreSQL profile works.
  compose:
    name: Docker Compose self-hosting (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.frankenphp]
    env:
      APOTHEKE_DOCKERFILE: ${{ matrix.dockerfile }}
      APOTHEKE_IMAGE_TAG: compose-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build with docker compose
        run: docker compose build
      - name: New install without APP_PASSWORD refuses to start (exit 78)
        run: |
          set -euo pipefail
          code=0
          APP_PASSWORD='' docker compose run --rm --no-deps apotheke > out.txt 2>&1 || code=$?
          cat out.txt
          test "$code" = 78
          grep -q 'sign-in is off' out.txt
          sudo rm -rf data
      - name: Start with APP_PASSWORD (compose .env) and wait until healthy
        run: |
          set -euo pipefail
          umask 077
          printf 'APP_PASSWORD=%s\nAPP_KEY=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -base64 32)" > .env
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
      - name: Published on 127.0.0.1 only (SEC-M3)
        run: |
          set -euo pipefail
          docker compose port apotheke 9091 | tee port.txt
          test "$(cat port.txt)" = 127.0.0.1:9091
          bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' apotheke)
          echo "$bindings"
          test "$bindings" = '{"9091/tcp":[{"HostIp":"127.0.0.1","HostPort":"9091"}]}'
          ip=$(hostname -I | awk '{print $1}')
          if curl -s -m 3 -o /dev/null "http://$ip:9091/healthz"; then echo "reachable on $ip" >&2; exit 1; fi
      - name: Smoke, web server and sign-in checks through compose
        run: |
          set -euo pipefail
          APP_PW=$(sed -n 's/^APP_PASSWORD=//p' .env)
          export APP_PW
          bash scripts/docker-auth-checks.sh http://127.0.0.1:9091
      - name: Restart keeps data and sign-in, without APP_PASSWORD
        run: |
          set -euo pipefail
          sed -i '/^APP_PASSWORD=/d' .env
          docker compose up -d --wait --wait-timeout 120 --force-recreate
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/)" = 303
          docker compose down
      - name: PostgreSQL profile
        run: |
          set -euo pipefail
          sudo rm -rf data
          umask 077
          printf 'APP_PASSWORD=%s\nDB_DRIVER=pgsql\nDB_PASSWORD=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env
          docker compose --profile postgres up -d --wait --wait-timeout 180
          APP_PW=$(sed -n 's/^APP_PASSWORD=//p' .env)
          export APP_PW
          bash scripts/docker-auth-checks.sh http://127.0.0.1:9091
          docker compose exec -T apotheke sh -c 'test "$DB_DRIVER" = pgsql'
      - name: Container logs
        if: always()
        run: docker compose --profile postgres logs --no-color || true
      - name: Clean up
        if: always()
        run: |
          docker compose --profile postgres down -v || true
          sudo rm -rf data .env

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Pinned gitleaks CLI (not the org-licensed GitHub Action). No token or license.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "pinned gitleaks build is linux x64; this runner is $(uname -m)" >&2
            exit 1
          fi
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          tmp="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "$tmp"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/$file" "$url"
          echo "${expected}  $tmp/$file" | sha256sum -c -
          tar -xzf "$tmp/$file" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1

  # PLAN step 16 (part 2, §3.6): upgrade and rollback. legacy@8.3 (v2.6.26, checked out into a temporary worktree)
  # seeds demo data with JPEG, PNG and HEIC originals, CI4@8.4 runs on the same data directory and database, then
  # legacy@8.3 again; each app
  # restores the other's backup zip, over the install and into a fresh one. The normalised DB dump and the sha256 of
  # images/, thumbs/, originals/, map/ and files/ must stay equal after every step, originals 0750/0640; mutation
  # checks prove the comparison catches a lost table or attachment (scripts/upgrade-rollback.sh).
  upgrade-rollback:
    name: Upgrade and rollback (2.6.26 → CI4@8.4 → 2.6.26, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: 'apotheke\test'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: ${{ matrix.db }}
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: '5432'
      TEST_PG_DB: apotheke
      TEST_PG_USER: apotheke
      TEST_PG_PASSWORD: 'apotheke\test'
      PHP83: php8.3
      PHP84: php8.4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, pdo_pgsql, pgsql, sqlite3, intl, exif, mbstring, zip, imagick, sodium
          coverage: none
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, pdo_pgsql, pgsql, sqlite3, intl, exif, mbstring, zip, imagick, sodium
          coverage: none
          tools: composer:v2
      - name: Install the HEIC decoder (the seed stores a HEIC photo)
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if timeout 120 sudo apt-get -o Acquire::Retries=3 update -qq \
              && timeout 180 sudo apt-get -o Acquire::Retries=3 install -y -qq libheif-plugin-libde265; then
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep $((i * 15))
          done
          exit 1
      - name: Install dependencies (the v2.6.26 worktree needs none)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Upgrade and rollback
        run: bash scripts/upgrade-rollback.sh
