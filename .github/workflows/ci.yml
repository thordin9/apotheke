name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Lint PHP, JS and shell scripts
        run: bash scripts/lint.sh

  test:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: ${{ matrix.db }}
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: '5432'
      TEST_PG_DB: apotheke
      TEST_PG_USER: apotheke
      TEST_PG_PASSWORD: apotheke
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, pdo_pgsql, exif, mbstring, dom
          coverage: pcov
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - name: Install zbar (QR round-trip tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zbar-tools
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Migrations via CLI (fresh database + idempotent re-run + seed)
        run: |
          export DATA_DIR="$RUNNER_TEMP/cli-data" DB_HOST=127.0.0.1 DB_PASSWORD=apotheke DB_SCHEMA=ci_cli
          php bin/migrate.php
          php bin/migrate.php | grep -q 'Already up to date'
          php bin/seed.php --demo
          php bin/seed.php --demo | grep -q 'Demo items created: 0'
          php bin/migrate.php --status
      - name: PHPUnit (unit + HTTP integration) with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover coverage/clover.xml --coverage-html coverage/html --log-junit coverage/junit.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.db }}
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Headless mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, exif, mbstring
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install puppeteer-core
        run: npm ci --prefix tests/e2e
      - name: Start app and seed demo data
        run: |
          mkdir -p /tmp/e2e-data
          DATA_DIR=/tmp/e2e-data php -S 127.0.0.1:8080 -t public public/index.php > /tmp/e2e-server.log 2>&1 &
          sleep 1
          php tests/e2e/seed.php http://127.0.0.1:8080
      - name: Run mobile checks (375×667, 390×844)
        run: CHROME="$(command -v google-chrome)" node tests/e2e/mobile.mjs http://127.0.0.1:8080
      - name: Server log
        if: always()
        run: cat /tmp/e2e-server.log || true

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apotheke
          POSTGRES_USER: apotheke
          POSTGRES_PASSWORD: apotheke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apotheke" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: apotheke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container (SQLite)
        run: docker run -d --name apotheke -p 8080:80 apotheke:ci
      - name: Smoke test SQLite (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Run container (PostgreSQL)
        run: |
          docker run -d --name apotheke-pg --network host \
            -e DB_DRIVER=pgsql -e DB_HOST=127.0.0.1 -e DB_NAME=apotheke -e DB_USER=apotheke -e DB_PASSWORD=apotheke \
            apotheke:ci sh -c "sed -i 's/Listen 80$/Listen 8081/' /etc/apache2/ports.conf && sed -i 's/:80>/:8081>/' /etc/apache2/sites-available/apotheke.conf && apotheke-entrypoint apache2-foreground"
      - name: Smoke test PostgreSQL (front page + upload)
        run: bash scripts/smoke.sh http://127.0.0.1:8081
      - name: Container logs
        if: always()
        run: |
          docker logs apotheke || true
          docker logs apotheke-pg || true

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit
        run: bash scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
