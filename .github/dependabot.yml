version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      tests-e2e:
        patterns: ['*']
