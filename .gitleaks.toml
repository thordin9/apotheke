# gitleaks generic-api-key flags password=SecretMissingEq99 in
# tests/Unit/MigrateDsnTest.php. That value is a migrate-banner fixture, not a
# credential, and the commit that added it stays in history.
# Both the path and the exact secret must match.
[extend]
useDefault = true

[[allowlists]]
description = "Migrate DSN test placeholder flagged by generic-api-key."
condition = "AND"
paths = ['''^tests/Unit/MigrateDsnTest\.php$''']
regexes = ['''^SecretMissingEq99$''']

# Placeholder APP_KEY values (base64 of "placeholder-key-a-32-bytes-long!" and
# "...-b-...") from the first S-L5 CI4 commit. The tests now build them at run
# time; that commit stays in history. Both the path and the exact value must match.
[[allowlists]]
description = "S-L5 CI4 test placeholder keys flagged by generic-api-key."
condition = "AND"
paths = ['''^ci4/tests/(Core/SecretBoxTest|Settings/SettingsServiceTest)\.php$''']
regexes = ['''^cGxhY2Vob2xkZXIta2V5LW[EI]tMzItYnl0ZXMtbG9uZyE=$''']

# A made-up autofill token in the first Control Panel parity test commit (58f4929). The test now builds its
# token at run time; that commit stays in history. Both the path and the exact value must match.
[[allowlists]]
description = "Control Panel parity test placeholder token flagged by generic-api-key."
condition = "AND"
paths = ['''^tests/Unit/Ci4ControlPanelParityTest\.php$''']
regexes = ['''^tok-Placeholder-7Q$''']

# The sha256 of migrations/0002_sort_keys_and_settings.php as released in 2.6.26, pinned in Ci4MigrateTest
# (LEGACY_MIGRATIONS) so the 2.6.26 migrations stay byte-identical. A public file hash, not a credential: the file
# name has "key" in it. Both the path and the exact value must match.
[[allowlists]]
description = "Ci4MigrateTest pinned 2.6.26 migration sha256 flagged by generic-api-key."
condition = "AND"
paths = ['''^tests/Unit/Ci4MigrateTest\.php$''']
regexes = ['''^f8066324b818295d8c616b37a9598691c7ac568b00867a59ced15c5357ac2d75$''']
